<script>
  // Ví dụ khởi tạo bảng – thay 'demo_getEmployees' bằng hàm server của bạn
  var table = new TXUI.DataTable('#mainTable', {
    columns: [
      { key: 'id', label: 'Mã' },
      { key: 'name', label: 'Tên' },
      { key: 'dept', label: 'Bộ phận' }
    ],
    exportable: true
  });
  table.setLoading(true);
  TXUI.run('demo_getEmployees')
    .then(function (rows) { table.setData(rows); })
    .catch(function (err) { TXUI.toast.error(err.message); table.setData([]); });

  document.getElementById('btnAdd').addEventListener('click', function () {
    TXUI.toast.info('Gắn chức năng thêm mới tại đây');
  });
</script>
