<!--
  TXUI_Scripts.html – Thư viện JavaScript của TXUI (không phụ thuộc thư viện ngoài).
  Đặt cuối <body>:  include('TXUI_Scripts')  (xem README)
  Namespace toàn cục: window.TXUI  (alias: window.UI)
-->
<script>
(function (global) {
  'use strict';

  var TXUI = { version: '1.0.0' };

  /* =====================================================================
   * TIỆN ÍCH CHUNG
   * ===================================================================== */
  var $  = function (sel, root) { return typeof sel === 'string' ? (root || document).querySelector(sel) : sel; };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  TXUI.$ = $; TXUI.$$ = $$;

  /** Escape HTML để chống XSS khi render dữ liệu người dùng */
  TXUI.escape = function (str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var esc = TXUI.escape;

  /** Tạo element từ chuỗi HTML */
  TXUI.html = function (htmlString) {
    var t = document.createElement('template');
    t.innerHTML = htmlString.trim();
    return t.content.firstElementChild;
  };

  TXUI.debounce = function (fn, wait) {
    var t; return function () { var ctx = this, args = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(ctx, args); }, wait || 250); };
  };
  TXUI.throttle = function (fn, wait) {
    var last = 0; return function () { var now = Date.now(); if (now - last >= (wait || 250)) { last = now; fn.apply(this, arguments); } };
  };
  TXUI.uid = function (prefix) { return (prefix || 'ui') + '-' + Math.random().toString(36).slice(2, 9); };

  /** Bỏ dấu tiếng Việt (dùng cho tìm kiếm không dấu) */
  TXUI.removeAccents = function (str) {
    return String(str || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
  };
  TXUI.matchText = function (haystack, needle) {
    return TXUI.removeAccents(haystack).toLowerCase().indexOf(TXUI.removeAccents(needle).toLowerCase().trim()) !== -1;
  };

  TXUI.copy = function (text) {
    var done = function () { TXUI.toast('Đã sao chép vào clipboard', { type: 'success', duration: 1800 }); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
    }
    fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { TXUI.toast('Không thể sao chép', { type: 'error' }); }
      ta.remove();
    }
  };

  /* =====================================================================
   * ĐỊNH DẠNG (chuẩn Việt Nam)
   * ===================================================================== */
  TXUI.format = {
    number: function (n, decimals) {
      if (n === '' || n === null || n === undefined || isNaN(n)) return '';
      return Number(n).toLocaleString('vi-VN', { minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals === undefined ? 2 : decimals });
    },
    currency: function (n, currency) {
      if (n === '' || n === null || n === undefined || isNaN(n)) return '';
      return Number(n).toLocaleString('vi-VN', { style: 'currency', currency: currency || 'VND', maximumFractionDigits: currency && currency !== 'VND' ? 2 : 0 });
    },
    percent: function (n, decimals) {
      if (n === '' || n === null || isNaN(n)) return '';
      return Number(n).toLocaleString('vi-VN', { style: 'percent', maximumFractionDigits: decimals === undefined ? 1 : decimals });
    },
    /** date(value, 'dd/MM/yyyy HH:mm:ss') */
    date: function (value, pattern) {
      if (!value) return '';
      var d = value instanceof Date ? value : new Date(value);
      if (isNaN(d)) return String(value);
      var p = function (n) { return String(n).padStart(2, '0'); };
      var map = { yyyy: d.getFullYear(), MM: p(d.getMonth() + 1), dd: p(d.getDate()), HH: p(d.getHours()), mm: p(d.getMinutes()), ss: p(d.getSeconds()) };
      return (pattern || 'dd/MM/yyyy').replace(/yyyy|MM|dd|HH|mm|ss/g, function (k) { return map[k]; });
    },
    datetime: function (value) { return TXUI.format.date(value, 'dd/MM/yyyy HH:mm'); },
    /** Chuyển chuỗi dd/MM/yyyy -> Date */
    parseDate: function (str) {
      var m = String(str || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (!m) return null;
      return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
    },
    /** Giá trị cho input[type=date] (yyyy-MM-dd) */
    isoDate: function (value) { return TXUI.format.date(value || new Date(), 'yyyy-MM-dd'); },
    relative: function (value) {
      var d = value instanceof Date ? value : new Date(value);
      var s = Math.round((Date.now() - d.getTime()) / 1000);
      if (s < 60) return 'vừa xong';
      if (s < 3600) return Math.floor(s / 60) + ' phút trước';
      if (s < 86400) return Math.floor(s / 3600) + ' giờ trước';
      if (s < 2592000) return Math.floor(s / 86400) + ' ngày trước';
      return TXUI.format.date(d);
    },
    fileSize: function (bytes) {
      if (!bytes) return '0 B';
      var u = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i];
    },
    initials: function (name) {
      var parts = String(name || '').trim().split(/\s+/);
      if (!parts[0]) return '?';
      return (parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : parts[0].slice(0, 2)).toUpperCase();
    }
  };

  /* =====================================================================
   * GỌI SERVER: TXUI.run('tenHam', thamSo1, thamSo2...) -> Promise
   *   - Tự dùng google.script.run khi chạy trong Apps Script
   *   - Khi chạy ngoài Apps Script (xem trước), dùng TXUI.mocks[tenHam]
   * ===================================================================== */
  TXUI.mocks = {};
  TXUI.isAppsScript = function () { return !!(global.google && google.script && google.script.run); };

  TXUI.run = function (fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (TXUI.isAppsScript()) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
          reject(err instanceof Error ? err : new Error(err && err.message ? err.message : String(err)));
        });
        if (typeof runner[fnName] !== 'function') return reject(new Error('Không tìm thấy hàm server: ' + fnName));
        runner[fnName].apply(runner, args);
      } else if (typeof TXUI.mocks[fnName] === 'function') {
        setTimeout(function () {
          try { resolve(TXUI.mocks[fnName].apply(null, args)); } catch (e) { reject(e); }
        }, 400 + Math.random() * 400);
      } else {
        reject(new Error('Không chạy trong Apps Script và không có mock cho: ' + fnName));
      }
    });
  };

  /**
   * TXUI.call – gọi server kèm loading + toast lỗi tự động.
   *   TXUI.call('saveData', [obj], { loading: 'Đang lưu...', success: 'Đã lưu!', button: btnEl })
   */
  TXUI.call = function (fnName, args, opts) {
    opts = opts || {};
    if (opts.button) TXUI.btnLoading(opts.button, true, opts.buttonText);
    else if (opts.loading !== false) TXUI.loading.show(opts.loading || 'Đang xử lý...');
    return TXUI.run.apply(null, [fnName].concat(args || []))
      .then(function (res) {
        if (opts.success) TXUI.toast(typeof opts.success === 'function' ? opts.success(res) : opts.success, { type: 'success' });
        return res;
      })
      .catch(function (err) {
        if (opts.error !== false) TXUI.toast(err.message || String(err), { type: 'error', title: 'Có lỗi xảy ra', duration: 6000 });
        throw err;
      })
      .finally(function () {
        if (opts.button) TXUI.btnLoading(opts.button, false);
        else if (opts.loading !== false) TXUI.loading.hide();
      });
  };

  /* =====================================================================
   * TOAST
   *   TXUI.toast('Nội dung', { type: 'success|error|warning|info', title, duration, position: 'top|bottom' })
   * ===================================================================== */
  var TOAST_ICON = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
  TXUI.toast = function (message, opts) {
    if (typeof opts === 'string') opts = { type: opts };
    opts = opts || {};
    var type = opts.type || 'info';
    var pos = opts.position === 'bottom' ? 'bottom' : 'top';
    var container = $('.toast-container.' + pos) || (function () {
      var c = document.createElement('div'); c.className = 'toast-container ' + pos;
      c.setAttribute('aria-live', 'polite'); document.body.appendChild(c); return c;
    })();
    var el = TXUI.html(
      '<div class="toast toast-' + type + '" role="status">' +
        '<i class="toast-icon fa-solid ' + (opts.icon || TOAST_ICON[type] || TOAST_ICON.info) + '"></i>' +
        '<div class="min-w-0 flex-1">' +
          (opts.title ? '<div class="toast-title">' + esc(opts.title) + '</div>' : '') +
          '<div class="toast-text">' + (opts.html ? message : esc(message)) + '</div>' +
        '</div>' +
        '<button type="button" class="toast-close" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>');
    var close = function () {
      if (el._closing) return; el._closing = true;
      el.classList.add('is-leaving'); setTimeout(function () { el.remove(); }, 300);
    };
    el.querySelector('.toast-close').addEventListener('click', close);
    container.appendChild(el);
    var duration = opts.duration === undefined ? 3500 : opts.duration;
    if (duration > 0) {
      var timer = setTimeout(close, duration);
      el.addEventListener('mouseenter', function () { clearTimeout(timer); });
      el.addEventListener('mouseleave', function () { timer = setTimeout(close, 1500); });
    }
    return { el: el, close: close };
  };
  ['success', 'error', 'warning', 'info'].forEach(function (t) {
    TXUI.toast[t] = function (msg, title, opts) { return TXUI.toast(msg, Object.assign({ type: t, title: title }, opts || {})); };
  });

  /* =====================================================================
   * KHÓA CUỘN BODY
   * ===================================================================== */
  var lockCount = 0;
  function lockBody()   { lockCount++; document.body.classList.add('ui-lock'); }
  function unlockBody() { lockCount = Math.max(0, lockCount - 1); if (!lockCount) document.body.classList.remove('ui-lock'); }

  /* =====================================================================
   * MODAL
   *   HTML: <div class="modal" id="myModal"> <div class="modal-backdrop"></div> <div class="modal-dialog">...</div> </div>
   *   Mở:   data-ui-toggle="modal" data-ui-target="#myModal"   hoặc TXUI.modal.open('#myModal')
   *   Đóng: data-ui-dismiss="modal"                            hoặc TXUI.modal.close('#myModal')
   *   Thuộc tính: data-static="true" (không đóng khi click nền / Esc)
   *   Sự kiện: 'ui:open', 'ui:close' trên phần tử modal
   * ===================================================================== */
  var openStack = [];
  function makeOverlay(kind) {
    return {
      open: function (target) {
        var el = $(target); if (!el || el.classList.contains('open')) return el;
        el.classList.add('open'); el.setAttribute('aria-hidden', 'false');
        openStack.push(el); lockBody();
        el._lastFocus = document.activeElement;
        var focusEl = el.querySelector('[autofocus], input:not([type=hidden]):not([disabled]), select, textarea, .btn-primary');
        setTimeout(function () { if (focusEl) focusEl.focus(); }, 60);
        el.dispatchEvent(new CustomEvent('ui:open', { bubbles: true }));
        return el;
      },
      close: function (target) {
        var el = target ? $(target) : openStack[openStack.length - 1]; if (!el || !el.classList.contains('open')) return el;
        el.classList.remove('open'); el.setAttribute('aria-hidden', 'true');
        openStack = openStack.filter(function (x) { return x !== el; }); unlockBody();
        if (el._lastFocus && el._lastFocus.focus) { try { el._lastFocus.focus(); } catch (e) {} }
        el.dispatchEvent(new CustomEvent('ui:close', { bubbles: true }));
        return el;
      },
      toggle: function (target) { var el = $(target); return el && el.classList.contains('open') ? this.close(el) : this.open(el); }
    };
  }
  TXUI.modal = makeOverlay('modal');
  TXUI.drawer = makeOverlay('drawer');

  /** Tạo modal động: TXUI.modal.create({ title, body (HTML), size: 'sm|lg|xl|full', footer (HTML), static }) */
  TXUI.modal.create = function (o) {
    o = o || {};
    var el = TXUI.html(
      '<div class="modal ' + (o.size ? 'modal-' + o.size : '') + '" role="dialog" aria-modal="true"' + (o.static ? ' data-static="true"' : '') + '>' +
        '<div class="modal-backdrop"></div>' +
        '<div class="modal-dialog">' +
          (o.title !== undefined ? '<div class="modal-header"><h3 class="modal-title">' + esc(o.title) + '</h3>' +
            '<button type="button" class="modal-close" data-ui-dismiss="modal" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button></div>' : '') +
          '<div class="modal-body">' + (o.body || '') + '</div>' +
          (o.footer ? '<div class="modal-footer">' + o.footer + '</div>' : '') +
        '</div>' +
      '</div>');
    document.body.appendChild(el);
    if (o.destroyOnClose !== false) el.addEventListener('ui:close', function () { setTimeout(function () { el.remove(); }, 200); });
    TXUI.modal.open(el);
    return el;
  };

  /* =====================================================================
   * DIALOG: alert / confirm / prompt (trả về Promise)
   *   await TXUI.alert('Đã lưu', { type: 'success' })
   *   if (await TXUI.confirm({ title: 'Xóa?', text: '...', type: 'danger', confirmText: 'Xóa' })) {...}
   *   var v = await TXUI.prompt({ title: 'Nhập lý do', required: true })
   * ===================================================================== */
  var DIALOG_ICON = { info: 'fa-circle-info', success: 'fa-check', warning: 'fa-triangle-exclamation', danger: 'fa-trash-can', error: 'fa-xmark', question: 'fa-question' };
  function dialog(o) {
    return new Promise(function (resolve) {
      var type = o.type === 'error' ? 'danger' : (o.type || 'question');
      var btnClass = { danger: 'btn-danger', warning: 'btn-warning', success: 'btn-success', info: 'btn-info' }[type] || 'btn-primary';
      var inputHtml = '';
      if (o.mode === 'prompt') {
        inputHtml = '<div class="mt-4 text-left">' +
          (o.label ? '<label class="form-label mb-1.5' + (o.required ? ' required' : '') + '">' + esc(o.label) + '</label>' : '') +
          (o.multiline
            ? '<textarea class="form-control" data-dialog-input rows="3" placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>'
            : '<input class="form-control" data-dialog-input type="' + (o.inputType || 'text') + '" placeholder="' + esc(o.placeholder || '') + '" value="' + esc(o.value || '') + '">') +
          '<p class="form-error mt-1.5 hidden" data-dialog-error><i class="fa-solid fa-circle-exclamation"></i> Vui lòng nhập thông tin</p></div>';
      }
      var el = TXUI.html(
        '<div class="modal modal-sm" role="alertdialog" aria-modal="true"' + (o.static ? ' data-static="true"' : '') + '>' +
          '<div class="modal-backdrop"></div>' +
          '<div class="modal-dialog">' +
            '<div class="modal-body pt-7 text-center">' +
              (o.icon === false ? '' : '<div class="dialog-icon ' + type + '"><i class="fa-solid ' + (o.icon || DIALOG_ICON[o.type] || DIALOG_ICON[type]) + '"></i></div>') +
              (o.title ? '<h3 class="text-lg font-semibold text-slate-900 dark:text-white">' + esc(o.title) + '</h3>' : '') +
              (o.text ? '<div class="mt-2 text-sm text-slate-500 dark:text-slate-400">' + (o.html ? o.text : esc(o.text)) + '</div>' : '') +
              inputHtml +
            '</div>' +
            '<div class="flex gap-2 px-6 pb-6">' +
              (o.mode !== 'alert' ? '<button type="button" class="btn btn-secondary flex-1" data-dialog="cancel">' + esc(o.cancelText || 'Hủy') + '</button>' : '') +
              '<button type="button" class="btn ' + btnClass + ' flex-1" data-dialog="ok">' + esc(o.confirmText || (o.mode === 'alert' ? 'Đóng' : 'Xác nhận')) + '</button>' +
            '</div>' +
          '</div>' +
        '</div>');
      document.body.appendChild(el);
      var input = el.querySelector('[data-dialog-input]');
      var result;
      var finish = function (val) { result = val; TXUI.modal.close(el); };
      el.addEventListener('ui:close', function () {
        setTimeout(function () { el.remove(); }, 200);
        if (result === undefined) result = o.mode === 'prompt' ? null : (o.mode === 'alert' ? true : false);
        resolve(result);
      });
      el.querySelector('[data-dialog="ok"]').addEventListener('click', function () {
        if (o.mode === 'prompt') {
          var v = input.value.trim();
          if (o.required && !v) { input.classList.add('is-invalid'); el.querySelector('[data-dialog-error]').classList.remove('hidden'); input.focus(); return; }
          return finish(v);
        }
        finish(true);
      });
      var cancel = el.querySelector('[data-dialog="cancel"]');
      if (cancel) cancel.addEventListener('click', function () { finish(o.mode === 'prompt' ? null : false); });
      if (input) input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !o.multiline) el.querySelector('[data-dialog="ok"]').click(); });
      TXUI.modal.open(el);
      if (!input) setTimeout(function () { el.querySelector('[data-dialog="ok"]').focus(); }, 60);
    });
  }
  function normalize(a, b) { return typeof a === 'string' ? Object.assign({ text: a }, b || {}) : (a || {}); }
  TXUI.alert   = function (a, b) { var o = normalize(a, b); o.mode = 'alert'; o.type = o.type || 'info'; return dialog(o); };
  TXUI.confirm = function (a, b) { var o = normalize(a, b); o.mode = 'confirm'; if (!o.title && !b) { o.title = o.text; o.text = ''; } return dialog(o); };
  TXUI.prompt  = function (a, b) { var o = normalize(a, b); o.mode = 'prompt'; o.icon = o.icon || false; if (!o.title) { o.title = o.text; o.text = ''; } return dialog(o); };

  /* =====================================================================
   * LOADING
   *   TXUI.loading.show('Đang tải...'); TXUI.loading.hide();
   *   TXUI.loading.block(el, true/false)  – che 1 vùng
   *   TXUI.btnLoading(btn, true/false, 'Đang lưu...')
   * ===================================================================== */
  var loadingCount = 0, loadingEl = null;
  TXUI.loading = {
    show: function (text) {
      loadingCount++;
      if (!loadingEl) {
        loadingEl = TXUI.html('<div class="loading-overlay"><div class="loading-box"><span class="spinner spinner-xl"></span><div class="loading-text"></div></div></div>');
        document.body.appendChild(loadingEl);
      }
      loadingEl.querySelector('.loading-text').textContent = text || 'Đang tải...';
    },
    hide: function (force) {
      loadingCount = force ? 0 : Math.max(0, loadingCount - 1);
      if (!loadingCount && loadingEl) { loadingEl.remove(); loadingEl = null; }
    },
    block: function (target, on) {
      var el = $(target); if (!el) return;
      el.classList.add('loading-block');
      var mask = el.querySelector(':scope > .loading-mask');
      if (on === false) { if (mask) mask.remove(); return; }
      if (!mask) el.appendChild(TXUI.html('<div class="loading-mask"><span class="spinner spinner-lg text-brand-700"></span></div>'));
    }
  };
  TXUI.btnLoading = function (btn, on, text) {
    btn = $(btn); if (!btn) return;
    if (on === false) {
      if (btn._origHtml !== undefined) { btn.innerHTML = btn._origHtml; delete btn._origHtml; }
      btn.disabled = false; btn.removeAttribute('aria-busy');
      return;
    }
    if (btn._origHtml === undefined) btn._origHtml = btn.innerHTML;
    btn.style.minWidth = btn.offsetWidth + 'px';
    btn.innerHTML = '<span class="spinner spinner-sm"></span>' + (text !== undefined ? esc(text) : (btn.classList.contains('btn-icon') ? '' : esc(btn.textContent.trim())));
    btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  };

  /* =====================================================================
   * DROPDOWN
   *   <div class="dropdown"> <button data-ui-toggle="dropdown">...</button> <div class="dropdown-menu">...</div> </div>
   * ===================================================================== */
  /** Panel nổi (dropdown/combobox) nằm trong vùng overflow sẽ được định vị fixed để không bị cắt */
  var CLIP_SEL = '.table-wrapper, .modal-body, .drawer-body, .overflow-hidden, .overflow-auto, .overflow-x-auto, .overflow-y-auto, [data-ui-float]';
  function floatPanel(anchor, panel, alignLeft) {
    resetPanel(panel);
    if (!anchor.parentElement.closest(CLIP_SEL)) return;
    var r = anchor.getBoundingClientRect();
    panel.style.position = 'fixed'; panel.style.margin = '0'; panel.style.right = 'auto'; panel.style.bottom = 'auto';
    var w = panel.offsetWidth, h = panel.offsetHeight;
    var left = alignLeft ? r.left : r.right - w;
    left = Math.max(8, Math.min(left, global.innerWidth - w - 8));
    var top = r.bottom + 6;
    if (top + h > global.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
    panel.style.left = left + 'px'; panel.style.top = top + 'px'; panel.style.zIndex = '150';
    panel._floating = true;
  }
  function resetPanel(panel) {
    if (!panel || !panel._floating) return;
    ['position', 'margin', 'right', 'bottom', 'left', 'top', 'zIndex', 'width'].forEach(function (k) { panel.style[k] = ''; });
    panel._floating = false;
  }
  TXUI.dropdown = {
    closeAll: function (except) {
      $$('.dropdown.open').forEach(function (d) {
        if (d !== except && !d.contains(except)) { d.classList.remove('open'); resetPanel(d.querySelector(':scope > .dropdown-menu')); }
      });
    },
    toggle: function (el) {
      var dd = $(el).closest('.dropdown'); var willOpen = !dd.classList.contains('open');
      TXUI.dropdown.closeAll(dd); dd.classList.toggle('open', willOpen);
      var menu = dd.querySelector(':scope > .dropdown-menu');
      if (willOpen && menu) floatPanel(dd, menu, menu.classList.contains('dropdown-left'));
      else resetPanel(menu);
    }
  };
  // Đóng panel nổi khi cuộn (tránh lệch vị trí) hoặc khi đổi kích thước cửa sổ
  global.addEventListener('scroll', function (e) {
    $$('.dropdown.open > .dropdown-menu').forEach(function (m) { if (m._floating && !m.contains(e.target)) TXUI.dropdown.closeAll(); });
    $$('.combo.open > .combo-panel').forEach(function (p) { if (p._floating && !p.contains(e.target)) p.parentElement._close(); });
  }, true);
  global.addEventListener('resize', function () { TXUI.dropdown.closeAll(); });

  /* =====================================================================
   * TABS
   *   <div data-ui-tabs> <div class="tabs"> <button class="tab active" data-tab="a">A</button> ... </div>
   *      <div class="tab-panel active" data-tab-panel="a">...</div> ... </div>
   * ===================================================================== */
  TXUI.tabs = {
    show: function (root, name) {

   *     data: [], pageSize: 10, pageSizes: [10,25,50,100], search: true, searchKeys: ['code','name'],

   *     emptyText: 'Không có dữ liệu', toolbar: '<button ...>' (HTML thêm bên phải), exportable: true, exportName: 'du-lieu',
   *     onRowClick: function (row, index, event) {}, onSelect: function (rows) {}
   *   });
   *   dt.setData(rows); dt.getData(); dt.getFiltered(); dt.getSelected(); dt.setLoading(true); dt.search('abc'); dt.exportCSV();

  function DataTable(el, options) {
    if (!(this instanceof DataTable)) return new DataTable(el, options);

    this.o = Object.assign({
      columns: [], data: [], pageSize: 10, pageSizes: [10, 25, 50, 100], search: true, searchKeys: null,
      selectable: false, rowKey: 'id', striped: false, hover: true, compact: false, stickyHeader: false, maxHeight: null,
      emptyText: 'Không có dữ liệu', emptyIcon: 'fa-inbox', toolbar: '', exportable: false, exportName: 'du-lieu',
      searchPlaceholder: 'Tìm kiếm...', pagination: true, onRowClick: null, onSelect: null, rowClass: null, filter: null
    }, options || {});
    this.data = (this.o.data || []).slice();
    this.page = 1; this.pageSize = this.o.pageSize; this.query = ''; this.sortKey = null; this.sortDir = 1;
    this.selected = new Set(); this.loading = false;
    this._build();
    this.render();
  }
  DataTable.prototype._build = function () {
    var o = this.o, self = this;
    var tblCls = ['table', o.hover ? 'table-hover' : '', o.striped ? 'table-striped' : '', o.compact ? 'table-compact' : '', o.stickyHeader || o.maxHeight ? 'table-sticky' : ''].join(' ');
    this.el.classList.add('dt');
    this.el.innerHTML =
      ((o.search || o.toolbar || o.exportable) ?
        '<div class="dt-toolbar">' +
          '<div class="flex items-center gap-2">' +
            (o.search ? '<div class="input-icon w-full sm:w-72"><i class="fa-solid fa-magnifying-glass text-xs"></i><input type="search" class="form-control" data-dt-search placeholder="' + esc(o.searchPlaceholder) + '"></div>' : '') +
          '</div>' +
          '<div class="flex flex-wrap items-center gap-2">' + (o.toolbar || '') +
            (o.exportable ? '<button type="button" class="btn btn-secondary btn-sm" data-dt-export><i class="fa-solid fa-file-csv"></i> Xuất CSV</button>' : '') +
          '</div>' +
        '</div>' : '') +
      '<div class="table-wrapper loading-block"' + (o.maxHeight ? ' style="max-height:' + o.maxHeight + ';overflow-y:auto"' : '') + '>' +
        '<table class="' + tblCls + '"><thead></thead><tbody></tbody></table>' +
      '</div>' +
      (o.pagination ? '<div class="dt-footer"><div class="flex items-center gap-2"><span data-dt-info></span>' +
        '<select class="form-control form-control-sm w-auto" data-dt-size>' + o.pageSizes.map(function (s) { return '<option value="' + s + '"' + (s === o.pageSize ? ' selected' : '') + '>' + s + ' / trang</option>'; }).join('') + '</select></div>' +
        '<nav data-dt-pages></nav></div>' : '');
    this.thead = this.el.querySelector('thead'); this.tbody = this.el.querySelector('tbody');
    var s = this.el.querySelector('[data-dt-search]');
    if (s) s.addEventListener('input', TXUI.debounce(function () { self.query = s.value; self.page = 1; self.render(); }, 200));
    var size = this.el.querySelector('[data-dt-size]');
    if (size) size.addEventListener('change', function () { self.pageSize = +size.value; self.page = 1; self.render(); });
    var ex = this.el.querySelector('[data-dt-export]'); if (ex) ex.addEventListener('click', function () { self.exportCSV(); });
    this.thead.addEventListener('click', function (e) {
      var all = e.target.closest('[data-dt-checkall]');
      if (all) { var rows = self._pageRows(); rows.forEach(function (r) { var k = self._key(r); all.checked ? self.selected.add(k) : self.selected.delete(k); }); self.render(); self._emitSelect(); return; }
      var th = e.target.closest('th[data-key]'); if (!th) return;
      var key = th.dataset.key; if (self.sortKey === key) self.sortDir = -self.sortDir; else { self.sortKey = key; self.sortDir = 1; }
      self.render();
    });
    this.tbody.addEventListener('click', function (e) {
      var cb = e.target.closest('[data-dt-check]');
      if (cb) { var k = cb.dataset.dtCheck; cb.checked ? self.selected.add(k) : self.selected.delete(k); self.render(); self._emitSelect(); return; }
      var tr = e.target.closest('tr[data-index]');
      if (tr && self.o.onRowClick && !e.target.closest('button, a, input, select, .dropdown')) {

      }

  };
  DataTable.prototype._key = function (row) { return String(row[this.o.rowKey] !== undefined ? row[this.o.rowKey] : this.data.indexOf(row)); };
  DataTable.prototype._emitSelect = function () { if (this.o.onSelect) this.o.onSelect(this.getSelected()); };
  DataTable.prototype._cell = function (col, row, i) {
    var v = row[col.key];
    if (col.render) return col.render(v, row, i);

    return esc(v);
  };
  DataTable.prototype.getFiltered = function () {
    var o = this.o, q = this.query, self = this;
    var keys = o.searchKeys || o.columns.map(function (c) { return c.key; });

    });
    if (this.sortKey) {
      var k = this.sortKey, d = this.sortDir;
      var col = o.columns.filter(function (c) { return c.key === k; })[0] || {};
      rows.sort(function (a, b) {
        var x = col.sortValue ? col.sortValue(a) : a[k], y = col.sortValue ? col.sortValue(b) : b[k];
        if (x === y) return 0; if (x === null || x === undefined || x === '') return 1; if (y === null || y === undefined || y === '') return -1;
        if (typeof x === 'number' && typeof y === 'number') return (x - y) * d;
        if (x instanceof Date || y instanceof Date) return (new Date(x) - new Date(y)) * d;
        return String(x).localeCompare(String(y), 'vi', { numeric: true }) * d;

  };
  DataTable.prototype._pageRows = function () {
    var rows = this.getFiltered();

  };
  DataTable.prototype.render = function () {
    var o = this.o, self = this;

    if (this.page > totalPages) this.page = totalPages;
    var rows = o.pagination ? all.slice((this.page - 1) * this.pageSize, this.page * this.pageSize) : all;
    this._view = rows;
    var allChecked = rows.length && rows.every(function (r) { return self.selected.has(self._key(r)); });
    this.thead.innerHTML = '<tr>' +
      (o.selectable ? '<th class="w-10"><input type="checkbox" class="form-check-input" data-dt-checkall' + (allChecked ? ' checked' : '') + '></th>' : '') +
      o.columns.map(function (c) {
        var sortable = c.sortable !== false && c.key && !c.noSort;
        var sorted = self.sortKey === c.key;
        return '<th' + (sortable ? ' data-key="' + esc(c.key) + '"' : '') + ' class="' + (sortable ? 'sortable ' : '') + (sorted ? 'sorted ' : '') + (c.align ? 'text-' + c.align + ' ' : '') + (c.headerClass || '') + '"' + (c.width ? ' style="width:' + c.width + '"' : '') + '>' +
          esc(c.label || '') + (sortable ? '<i class="sort-icon fa-solid ' + (sorted ? (self.sortDir === 1 ? 'fa-arrow-up' : 'fa-arrow-down') : 'fa-sort') + '"></i>' : '') + '</th>';
      }).join('') + '</tr>';
    var colspan = o.columns.length + (o.selectable ? 1 : 0);
    if (this.loading && !this.data.length) {
      this.tbody.innerHTML = Array.apply(null, Array(5)).map(function () {
        return '<tr>' + Array.apply(null, Array(colspan)).map(function () { return '<td><div class="skeleton h-4 w-full max-w-[160px]"></div></td>'; }).join('') + '</tr>';
      }).join('');
    } else if (!rows.length) {
      this.tbody.innerHTML = '<tr><td colspan="' + colspan + '"><div class="empty-state py-10"><div class="empty-state-icon"><i class="fa-solid ' + o.emptyIcon + '"></i></div>' +
        '<div class="empty-state-text">' + esc(this.query ? 'Không tìm thấy kết quả cho "' + this.query + '"' : o.emptyText) + '</div></div></td></tr>';
    } else {
      this.tbody.innerHTML = rows.map(function (r, i) {
        var k = self._key(r), sel = self.selected.has(k);
        var extra = o.rowClass ? o.rowClass(r) : '';
        return '<tr data-index="' + i + '" class="' + (sel ? 'selected ' : '') + (o.onRowClick ? 'cursor-pointer ' : '') + (extra || '') + '">' +
          (o.selectable ? '<td><input type="checkbox" class="form-check-input" data-dt-check="' + esc(k) + '"' + (sel ? ' checked' : '') + '></td>' : '') +
          o.columns.map(function (c) {
            return '<td class="' + (c.align ? 'text-' + c.align + ' ' : '') + (c.className || '') + '">' + self._cell(c, r, i) + '</td>';
          }).join('') + '</tr>';
      }).join('');
    }
    var info = this.el.querySelector('[data-dt-info]');
    if (info) {

      info.textContent = 'Hiển thị ' + from + '–' + to + ' / ' + all.length + ' dòng' + (this.selected.size ? ' · Đã chọn ' + this.selected.size : '');

  };
  DataTable.prototype.setData = function (rows) { this.data = (rows || []).slice(); this.selected.clear(); this.loading = false; return this.render(); };

  DataTable.prototype.exportCSV = function (filename) {
    var cols = this.o.columns.filter(function (c) { return c.key && c.export !== false; });

    var q = function (v) { v = v === null || v === undefined ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = [cols.map(function (c) { return q(c.label || c.key); }).join(',')].concat(rows.map(function (r) {
      return cols.map(function (c) {

  };
  TXUI.DataTable = DataTable;

  /** Tải file về máy từ chuỗi/Blob */
  TXUI.download = function (content, filename, mime) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  /** Tải file từ base64 (server trả về) */
  TXUI.downloadBase64 = function (b64, filename, mime) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    TXUI.download(new Blob([arr], { type: mime || 'application/octet-stream' }), filename);
  };

  /* =====================================================================
   * CHART – bọc Chart.js (tự tải khi cần) với bảng màu thương hiệu
   *   TXUI.chart('#canvas', { type: 'bar', data: {...}, options: {...} }).then(chart => ...)
   * ===================================================================== */
  TXUI.palette = ['#0b5a41', '#a6ce39', '#278464', '#f59e0b', '#0ea5e9', '#ef4444', '#8b5cf6', '#64748b', '#7dc0a2', '#c6e16f'];
  var chartLoader = null;
  TXUI.loadScript = function (src) {
    return new Promise(function (resolve, reject) {

  TXUI.chart = function (canvas, config) {
    chartLoader = chartLoader || (global.Chart ? Promise.resolve() : TXUI.loadScript('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js'));

      var el = $(canvas);
      if (el._chart) el._chart.destroy();
      var dark = TXUI.theme.get() === 'dark';
      Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
      Chart.defaults.color = dark ? '#94a3b8' : '#64748b';
      Chart.defaults.borderColor = dark ? 'rgba(148,163,184,.15)' : 'rgba(148,163,184,.25)';

      (config.data.datasets || []).forEach(function (ds, i) {

  /* =====================================================================
   * HIỆN CODE MẪU (dùng trong trang tài liệu) – <div data-ui-demo> ... </div>
   * ===================================================================== */
  TXUI.dedent = function (s) {
    var lines = s.replace(/^\n+|\s+$/g, '').split('\n');

    return lines.map(function (l) { return l.slice(min); }).join('\n');
  };

  /* =====================================================================
   * KHỞI TẠO – event delegation + init các thành phần cần JS
   * ===================================================================== */
  TXUI.init = function (root) {
    root = root || document;
    $$('[data-ui-dropzone]', root).forEach(initDropzone);

  document.addEventListener('click', function (e) {
    var t = e.target;
    // Click ra ngoài (hoặc chọn 1 mục) -> đóng dropdown

</script>
