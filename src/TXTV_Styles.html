    .timeline-h-item:first-child::before { @apply left-1/2; }
    .timeline-h-item:last-child::before { @apply right-1/2; }
    .timeline-h-item.done::before { @apply bg-brand-700; }
    .timeline-h-dot { @apply absolute left-1/2 top-0 z-10 grid h-6 w-6 -translate-x-1/2 place-items-center rounded-full border-2 border-slate-300 bg-white text-[10px] dark:border-slate-600 dark:bg-slate-900; }
    .timeline-h-item.done .timeline-h-dot { @apply border-brand-700 bg-brand-700 text-white; }
    .timeline-h-item.active .timeline-h-dot { @apply border-brand-700 text-brand-700 ring-4 ring-brand-100 dark:ring-brand-900; }
    .timeline-h-title { @apply text-sm font-semibold text-slate-900 dark:text-white; }
    .timeline-h-time { @apply text-xs text-slate-400; }

    /* Bảng giá / gói dịch vụ */
    .plan { @apply relative flex flex-col rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900; }
    .plan.featured { @apply border-2 border-brand-700 shadow-soft dark:border-accent-400; }
    .plan-badge { @apply absolute -top-3 left-1/2 -translate-x-1/2 rounded-full bg-brand-700 px-3 py-0.5 text-xs font-semibold text-white; }
    .plan-name { @apply text-sm font-semibold uppercase tracking-wide text-brand-700 dark:text-accent-400; }
    .plan-price { @apply mt-2 text-3xl font-extrabold text-slate-900 dark:text-white; }
    .plan-price small { @apply text-sm font-medium text-slate-400; }
    .plan-features { @apply my-5 flex-1 space-y-2 text-sm; }
    .plan-features li { @apply flex gap-2; }
    .plan-features li::before { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; @apply text-emerald-500; }
    .plan-features li.off { @apply text-slate-400 line-through; }
    .plan-features li.off::before { content: '\f00d'; @apply text-slate-300; }

    /* Sửa trực tiếp (click để sửa) */
    .inline-edit { @apply -mx-1 cursor-pointer rounded px-1 decoration-slate-300 decoration-dashed underline-offset-4 hover:bg-amber-50 hover:underline dark:hover:bg-amber-950/30; }
    .inline-edit.is-empty { @apply italic text-slate-400; }
    .inline-edit-input { @apply h-8 rounded-md border border-brand-600 bg-white px-2 text-sm outline-none ring-2 ring-brand-600/20 dark:bg-slate-900; }

    /* Hover card */
    .hovercard { @apply fixed z-[170] w-72 animate-fade-in rounded-xl bg-white p-4 shadow-xl ring-1 ring-black/5 dark:bg-slate-800 dark:ring-white/10; }

    /* Time / Month picker */
    .timepicker-list { @apply grid max-h-56 grid-cols-4 gap-1 overflow-y-auto; }
    .monthpicker-grid { @apply grid grid-cols-3 gap-1.5; }
    .monthpicker-grid > div { @apply cursor-pointer rounded-lg py-2.5 text-center text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700; }
    .monthpicker-grid > div.selected { @apply bg-brand-700 font-semibold text-white; }
    .monthpicker-grid > div.current { @apply font-bold text-brand-700 dark:text-accent-400; }

    /* Lọc nhanh danh sách: phần tử bị ẩn */
    .tv-filtered-out { display: none !important; }

    /* Bảng sắp xếp được (HTML tĩnh) */
    table[data-tv-sort] th:not([data-nosort]) { @apply cursor-pointer select-none hover:text-slate-800 dark:hover:text-white; }
    table[data-tv-sort] th .sort-icon { @apply ml-1 text-[10px] opacity-40; }
    table[data-tv-sort] th.sorted .sort-icon { @apply text-brand-700 opacity-100 dark:text-accent-400; }

    /* Đánh giá cảm xúc / phản hồi nhanh */
    .reactions { @apply inline-flex gap-1 rounded-full bg-slate-100 p-1 dark:bg-slate-800; }
    .reactions > button { @apply grid h-9 w-9 place-items-center rounded-full text-xl grayscale transition hover:scale-110 hover:grayscale-0; }
    .reactions > button.selected { @apply bg-white grayscale-0 shadow dark:bg-slate-700; }

    /* Khung trình chiếu / đếm KPI lớn (màn hình TV) */
    .kpi-big { @apply rounded-xl bg-brand-900 p-6 text-white; }
    .kpi-big-value { @apply text-5xl font-extrabold tabular-nums tracking-tight; }
    .kpi-big-label { @apply mt-1 text-sm uppercase tracking-wider text-white/60; }

    /* =====================================================================
     * MỞ RỘNG (v1.5) – tham khảo shadcn/ui & Tailwind UI
     * ===================================================================== */
    .input-box:has(> .is-invalid) { @apply border-red-500 focus-within:border-red-500 focus-within:ring-red-500/15; }

    /* Menubar (thanh menu kiểu ứng dụng desktop) */
    .menubar { @apply inline-flex h-10 items-center gap-0.5 rounded-lg border border-slate-200 bg-white p-1 shadow-[0_1px_2px_rgba(15,23,42,.05)] dark:border-slate-700 dark:bg-slate-900; }
    .menubar > .dropdown > [data-tv-toggle="dropdown"] { @apply rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800; }
    .menubar > .dropdown.open > [data-tv-toggle="dropdown"] { @apply bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white; }
    .menubar .dropdown-menu { @apply left-0 right-auto mt-2 origin-top-left; }
    .dropdown-shortcut { @apply ml-auto pl-6 text-xs tracking-wide text-slate-400; }
    .dropdown-item.checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; @apply ml-auto pl-4 text-[11px] text-brand-700 dark:text-accent-400; }

    /* Navigation menu (menu lớn có mô tả) */
    .nav-menu { @apply flex items-center gap-1; }
    .nav-menu > .dropdown > [data-tv-toggle="dropdown"], .nav-menu > a { @apply inline-flex h-9 items-center gap-1.5 rounded-md px-3 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800; }
    .nav-menu > .dropdown > [data-tv-toggle="dropdown"]::after { content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900; @apply text-[10px] text-slate-400 transition-transform; }
    .nav-menu > .dropdown.open > [data-tv-toggle="dropdown"] { @apply bg-slate-100 dark:bg-slate-800; }
    .nav-menu > .dropdown.open > [data-tv-toggle="dropdown"]::after { @apply rotate-180; }
    .nav-menu .dropdown-menu { @apply left-0 right-auto mt-2 origin-top-left p-2; }
    .nav-menu-grid { @apply grid w-[min(36rem,calc(100vw-2rem))] gap-1 sm:grid-cols-2; }
    .nav-menu-link { @apply flex gap-3 rounded-md p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50; }
    .nav-menu-link > i { @apply mt-0.5 w-5 shrink-0 text-center text-brand-700 dark:text-accent-400; }
    .nav-menu-title { @apply text-sm font-medium text-slate-900 dark:text-white; }
    .nav-menu-desc { @apply mt-0.5 text-[13px] leading-snug text-slate-500 dark:text-slate-400; }
    .nav-menu-feature { @apply flex flex-col justify-end rounded-md bg-brand-900 p-4 text-white sm:row-span-3; }

    /* Scroll area: thanh cuộn mảnh + bóng mờ báo còn nội dung */
    .scroll-area { @apply relative overflow-auto; scrollbar-width: thin; }
    .scroll-area::-webkit-scrollbar { width: 6px; height: 6px; }
    .scroll-area.shadow-top { box-shadow: inset 0 10px 8px -8px rgba(15,23,42,.12); }
    .scroll-area.shadow-bottom { box-shadow: inset 0 -10px 8px -8px rgba(15,23,42,.12); }
    .scroll-area.shadow-top.shadow-bottom { box-shadow: inset 0 10px 8px -8px rgba(15,23,42,.12), inset 0 -10px 8px -8px rgba(15,23,42,.12); }

    /* Item – dòng nội dung: media + nội dung + thao tác (shadcn Item) */
    .item { @apply flex items-center gap-4 rounded-lg p-3 text-sm; }
    .item-outline { @apply border border-slate-200 dark:border-slate-800; }
    .item-muted { @apply bg-slate-50 dark:bg-slate-900; }
    .item-hover { @apply cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/60; }
    .item-media { @apply grid h-10 w-10 shrink-0 place-items-center overflow-hidden rounded-md border border-slate-200 bg-slate-50 text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300; }
    .item-media > img { @apply h-full w-full object-cover; }
    .item-content { @apply flex min-w-0 flex-1 flex-col gap-0.5; }
    .item-title { @apply truncate font-medium text-slate-900 dark:text-white; }
    .item-desc { @apply line-clamp-2 text-[13px] leading-snug text-slate-500 dark:text-slate-400; }
    .item-actions { @apply flex shrink-0 items-center gap-2; }
    .item-group { @apply divide-y divide-slate-100 overflow-hidden rounded-lg border border-slate-200 dark:divide-slate-800 dark:border-slate-800; }
    .item-group > .item { @apply rounded-none; }

    /* Page heading (tiêu đề trang có thông tin phụ + nút) */
    .page-heading { @apply mb-6 flex flex-col gap-4 border-b border-slate-200 pb-5 md:flex-row md:items-end md:justify-between dark:border-slate-800; }
    .page-heading-title { @apply text-2xl font-bold tracking-tight text-slate-900 dark:text-white; }
    .page-heading-meta { @apply mt-2 flex flex-wrap items-center gap-x-5 gap-y-1.5 text-[13px] text-slate-500 dark:text-slate-400; }
    .page-heading-meta > span { @apply inline-flex items-center gap-1.5; }
    .page-heading-meta i { @apply text-slate-400; }
    .page-heading-actions { @apply flex flex-wrap gap-2; }

    /* Action panel (khối mô tả + 1 hành động) */
    .action-panel { @apply flex flex-col gap-4 rounded-lg border border-slate-200 bg-white p-5 sm:flex-row sm:items-center sm:justify-between dark:border-slate-800 dark:bg-slate-900; }
    .action-panel-title { @apply text-sm font-semibold text-slate-900 dark:text-white; }
    .action-panel-text { @apply mt-1 max-w-xl text-[13px] leading-snug text-slate-500 dark:text-slate-400; }
    .action-panel.danger { @apply border-red-200 dark:border-red-900/60; }

    /* Steps dạng panel (Tailwind UI) */
    .steps-panels { @apply grid overflow-hidden rounded-lg border border-slate-200 md:grid-cols-[repeat(auto-fit,minmax(0,1fr))] dark:border-slate-800; }
    .step-panel { @apply relative flex items-center gap-3 border-b border-slate-200 px-5 py-4 last:border-0 md:border-b-0 md:border-r dark:border-slate-800; }
    .step-panel:last-child { @apply md:border-r-0; }
    .step-panel .step-index { @apply h-9 w-9; }
    .step-panel-title { @apply text-sm font-semibold text-slate-900 dark:text-white; }
    .step-panel-text { @apply text-xs text-slate-500; }
    .step-panel.done .step-index { @apply border-brand-700 bg-brand-700 text-white; }
    .step-panel.active { @apply bg-brand-50/50 dark:bg-brand-900/20; }
    .step-panel.active .step-index { @apply border-brand-700 text-brand-700 dark:border-accent-400 dark:text-accent-400; }
    .step-panel.active::after { content: ''; @apply absolute bottom-0 left-0 right-0 h-0.5 bg-brand-700 dark:bg-accent-400; }

    /* Prose – định dạng nội dung văn bản (bài viết, thông báo, HTML từ editor) */
    .prose-tv { @apply max-w-none text-[15px] leading-7 text-slate-700 dark:text-slate-300; }
    .prose-tv > * + * { @apply mt-4; }
    .prose-tv h1 { @apply text-2xl font-bold tracking-tight text-slate-900 dark:text-white; }
    .prose-tv h2 { @apply mt-8 text-xl font-semibold text-slate-900 dark:text-white; }
    .prose-tv h3 { @apply mt-6 text-base font-semibold text-slate-900 dark:text-white; }
    .prose-tv a { @apply font-medium text-brand-700 underline underline-offset-2 dark:text-accent-400; }
    .prose-tv ul { @apply list-disc space-y-1 pl-5 marker:text-slate-400; }
    .prose-tv ol { @apply list-decimal space-y-1 pl-5 marker:text-slate-400; }
    .prose-tv blockquote { @apply border-l-2 border-slate-300 pl-4 italic text-slate-600 dark:border-slate-600 dark:text-slate-400; }
    .prose-tv code { @apply rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[13px] text-slate-800 dark:bg-slate-800 dark:text-slate-200; }
    .prose-tv hr { @apply my-8 border-slate-200 dark:border-slate-800; }
    .prose-tv table { @apply w-full text-left text-sm; }
    .prose-tv th { @apply border-b border-slate-300 py-2 pr-4 font-semibold text-slate-900 dark:border-slate-600 dark:text-white; }
    .prose-tv td { @apply border-b border-slate-200 py-2 pr-4 dark:border-slate-800; }
    .prose-tv strong { @apply font-semibold text-slate-900 dark:text-white; }

    /* Alert có nút thao tác */
    .alert-actions { @apply mt-3 flex flex-wrap gap-2; }
    .alert-actions .btn { @apply h-7 px-2.5 text-xs; }

    /* Kbd nhóm */
    .kbd-group { @apply inline-flex items-center gap-1; }

  }

  @layer utilities {
    .scrollbar-none { scrollbar-width: none; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .text-balance { text-wrap: balance; }
  }
</style>

<!-- CSS thuần (không cần Tailwind xử lý) -->
<style>
  /* Mũi tên cho select */
  select.form-control:not([multiple]), select.form-select {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
    background-position: right .6rem center; background-repeat: no-repeat; background-size: 1.25em 1.25em;
  }

  /* Tooltip thuần CSS: <button data-tooltip="Nội dung" data-tooltip-pos="top|bottom|left|right"> */
  [data-tooltip] { position: relative; }
  [data-tooltip]::after {
    content: attr(data-tooltip); position: absolute; z-index: 60; pointer-events: none;
    left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%) translateY(4px);
    background: #0f172a; color: #fff; font-size: 12px; font-weight: 500; line-height: 1.3;
    padding: 6px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity .15s, transform .15s;
    box-shadow: 0 4px 12px rgba(0,0,0,.15); text-transform: none; letter-spacing: normal;
  }
  [data-tooltip]:hover::after, [data-tooltip]:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  [data-tooltip-pos="bottom"]::after { bottom: auto; top: calc(100% + 8px); transform: translateX(-50%) translateY(-4px); }
  [data-tooltip-pos="left"]::after   { left: auto; right: calc(100% + 8px); bottom: 50%; transform: translateY(50%) translateX(4px); }
  [data-tooltip-pos="right"]::after  { left: calc(100% + 8px); bottom: 50%; transform: translateY(50%) translateX(-4px); }
  [data-tooltip-pos="left"]:hover::after, [data-tooltip-pos="right"]:hover::after { transform: translateY(50%) translateX(0); }
  [data-tooltip-pos="bottom"]:hover::after { transform: translateX(-50%) translateY(0); }

  @keyframes tv-ticker { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  @keyframes tv-toast-timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes tv-sheet-in { from { transform: translateY(100%); } to { transform: none; } }

  /* Khóa cuộn khi mở modal/drawer */
  body.tv-lock { overflow: hidden; }

  /* In ấn */
  .print-only { display: none; }
  @media print {
    .no-print, .app-sidebar, .app-topbar, .app-backdrop, .toast-container, .fab { display: none !important; }
    .print-only { display: block; }
    .app-main { padding-left: 0 !important; }
    body { background: #fff !important; }
    .card, .table-wrapper { box-shadow: none !important; break-inside: avoid; }
  }
</style>
