<!--
  TXTV_Styles.html – Toàn bộ class component của TXTV (Tailwind @apply).
  Được include tự động từ TXTV_Head. Có hỗ trợ Dark mode (class "dark" trên <html>).
-->
<style type="text/tailwindcss">
  /* =====================================================================
   * BASE
   * ===================================================================== */
  @layer base {
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-feature-settings: 'cv11', 'ss01'; }
    body { @apply bg-slate-50 font-sans text-sm text-slate-700 dark:bg-slate-950 dark:text-slate-300; }
    h1, h2, h3, h4, h5, h6 { @apply font-semibold text-slate-900 dark:text-white; }
    ::selection { @apply bg-accent-300 text-brand-950; }
    [hidden], .is-hidden { display: none !important; }
    * { scrollbar-width: thin; scrollbar-color: theme('colors.slate.300') transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { @apply rounded-full bg-slate-300 dark:bg-slate-700; }
    *::-webkit-scrollbar-track { background: transparent; }
  }

  @layer components {
    /* =====================================================================
     * TYPOGRAPHY / LINK
     * ===================================================================== */
    .link { @apply font-medium text-brand-700 underline-offset-2 hover:underline dark:text-accent-400; }
    .text-muted { @apply text-slate-500 dark:text-slate-400; }
    .heading-1 { @apply text-3xl font-bold tracking-tight text-slate-900 dark:text-white; }
    .heading-2 { @apply text-2xl font-bold tracking-tight text-slate-900 dark:text-white; }
    .heading-3 { @apply text-xl font-semibold text-slate-900 dark:text-white; }
    .heading-4 { @apply text-base font-semibold text-slate-900 dark:text-white; }
    .kbd { @apply inline-flex items-center rounded-md border border-b-2 border-slate-300 bg-slate-50 px-1.5 py-0.5 font-mono text-[11px] font-medium text-slate-600 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300; }
    .code { @apply rounded-md bg-slate-100 px-1.5 py-0.5 font-mono text-[12px] text-pink-600 dark:bg-slate-800 dark:text-pink-400; }

    /* =====================================================================
     * BUTTON
     * ===================================================================== */
    .btn {
      @apply inline-flex h-9 select-none items-center justify-center gap-2 whitespace-nowrap rounded-lg border border-transparent px-4
             text-sm font-medium leading-none transition-colors duration-150
             focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2
             disabled:pointer-events-none disabled:opacity-50 dark:focus-visible:ring-offset-slate-900;
    }
    .btn.disabled { @apply pointer-events-none opacity-50; }
    .btn-xs { @apply h-7 gap-1.5 rounded-md px-2.5 text-xs; }
    .btn-sm { @apply h-8 gap-1.5 px-3 text-xs; }
    .btn-lg { @apply h-11 px-5 text-base; }
    .btn-xl { @apply h-12 rounded-xl px-6 text-base; }
    .btn-block { @apply w-full; }
    .btn-pill { @apply rounded-full; }
    .btn-icon { @apply w-9 px-0; }
    .btn-icon.btn-xs { @apply w-7; }
    .btn-icon.btn-sm { @apply w-8; }
    .btn-icon.btn-lg { @apply w-11; }
    .btn-icon.btn-xl { @apply w-12; }

    .btn-primary   { @apply bg-brand-700 text-white shadow-sm hover:bg-brand-800 active:bg-brand-900 dark:bg-brand-600 dark:hover:bg-brand-500; }
    .btn-accent    { @apply bg-accent-400 text-brand-950 shadow-sm hover:bg-accent-500 active:bg-accent-600; }
    .btn-secondary { @apply border-slate-300 bg-white text-slate-700 shadow-sm hover:bg-slate-50 active:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700; }
    .btn-success   { @apply bg-emerald-600 text-white shadow-sm hover:bg-emerald-700 active:bg-emerald-800; }
    .btn-warning   { @apply bg-amber-500 text-white shadow-sm hover:bg-amber-600 active:bg-amber-700; }
    .btn-danger    { @apply bg-red-600 text-white shadow-sm hover:bg-red-700 active:bg-red-800; }
    .btn-info      { @apply bg-sky-600 text-white shadow-sm hover:bg-sky-700 active:bg-sky-800; }
    .btn-dark      { @apply bg-slate-900 text-white shadow-sm hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white; }

    .btn-outline         { @apply border-brand-700 bg-transparent text-brand-700 hover:bg-brand-50 dark:border-brand-400 dark:text-brand-300 dark:hover:bg-brand-900/40; }
    .btn-outline-danger  { @apply border-red-500 bg-transparent text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/40; }
    .btn-outline-warning { @apply border-amber-500 bg-transparent text-amber-600 hover:bg-amber-50 dark:hover:bg-amber-950/40; }
    .btn-outline-success { @apply border-emerald-500 bg-transparent text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40; }

    .btn-soft         { @apply bg-brand-50 text-brand-700 hover:bg-brand-100 dark:bg-brand-900/40 dark:text-brand-200 dark:hover:bg-brand-900/70; }
    .btn-soft-danger  { @apply bg-red-50 text-red-700 hover:bg-red-100 dark:bg-red-950/40 dark:text-red-300; }
    .btn-soft-warning { @apply bg-amber-50 text-amber-700 hover:bg-amber-100 dark:bg-amber-950/40 dark:text-amber-300; }
    .btn-soft-success { @apply bg-emerald-50 text-emerald-700 hover:bg-emerald-100 dark:bg-emerald-950/40 dark:text-emerald-300; }
    .btn-soft-info    { @apply bg-sky-50 text-sky-700 hover:bg-sky-100 dark:bg-sky-950/40 dark:text-sky-300; }

    .btn-ghost { @apply text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white; }
    .btn-link  { @apply h-auto px-0 text-brand-700 hover:underline dark:text-accent-400; }

    .btn-group { @apply inline-flex items-stretch rounded-lg shadow-sm; }
    .btn-group > .btn { @apply rounded-none shadow-none first:rounded-l-lg last:rounded-r-lg; }
    .btn-group > .btn:not(:first-child) { @apply -ml-px; }
    .btn-group > .btn.active { @apply z-10 border-brand-700 bg-brand-50 text-brand-800 dark:bg-brand-900/50 dark:text-brand-200; }

    /* Floating action button */
    .fab { @apply fixed bottom-6 right-6 z-40 grid h-14 w-14 place-items-center rounded-full bg-brand-700 text-xl text-white shadow-lg transition hover:scale-105 hover:bg-brand-800; }

    /* =====================================================================
     * BADGE / CHIP / DOT
     * ===================================================================== */
    .badge { @apply inline-flex items-center gap-1 whitespace-nowrap rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset; }
    .badge-pill    { @apply rounded-full; }
    .badge-lg      { @apply px-2.5 py-1 text-sm; }
    .badge-gray    { @apply bg-slate-50 text-slate-600 ring-slate-500/20 dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-600; }
    .badge-brand   { @apply bg-brand-50 text-brand-700 ring-brand-600/20 dark:bg-brand-900/40 dark:text-brand-200 dark:ring-brand-500/30; }
    .badge-accent  { @apply bg-accent-50 text-accent-800 ring-accent-600/30 dark:bg-accent-900/30 dark:text-accent-300; }
    .badge-success { @apply bg-emerald-50 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-950/40 dark:text-emerald-300; }
    .badge-warning { @apply bg-amber-50 text-amber-800 ring-amber-600/20 dark:bg-amber-950/40 dark:text-amber-300; }
    .badge-danger  { @apply bg-red-50 text-red-700 ring-red-600/20 dark:bg-red-950/40 dark:text-red-300; }
    .badge-info    { @apply bg-sky-50 text-sky-700 ring-sky-600/20 dark:bg-sky-950/40 dark:text-sky-300; }
    .badge-purple  { @apply bg-violet-50 text-violet-700 ring-violet-600/20 dark:bg-violet-950/40 dark:text-violet-300; }
    .badge-solid   { @apply bg-brand-700 text-white ring-0; }

    .dot { @apply inline-block h-2 w-2 shrink-0 rounded-full bg-slate-400; }
    .dot-success { @apply bg-emerald-500; }
    .dot-warning { @apply bg-amber-500; }
    .dot-danger  { @apply bg-red-500; }
    .dot-info    { @apply bg-sky-500; }
    .dot-brand   { @apply bg-brand-600; }
    .dot-pulse   { @apply relative; }
    .dot-pulse::after { content: ''; @apply absolute inset-0 animate-ping rounded-full bg-inherit opacity-75; }

    .chip { @apply inline-flex h-7 items-center gap-1.5 rounded-full bg-slate-100 pl-3 pr-1.5 text-xs font-medium text-slate-700 dark:bg-slate-800 dark:text-slate-200; }
    .chip-brand { @apply bg-brand-50 text-brand-800 dark:bg-brand-900/50 dark:text-brand-200; }
    .chip-remove { @apply grid h-5 w-5 cursor-pointer place-items-center rounded-full text-[10px] text-slate-500 hover:bg-slate-300/60 hover:text-slate-800 dark:hover:bg-slate-700; }

    /* =====================================================================
     * ALERT
     * ===================================================================== */
    .alert { @apply relative flex gap-3 rounded-xl border p-4 text-sm; }
    .alert > i:first-child { @apply mt-0.5 text-base; }
    .alert-title { @apply mb-0.5 font-semibold; }
    .alert-close { @apply ml-auto -mr-1 -mt-1 grid h-7 w-7 shrink-0 place-items-center rounded-md opacity-60 hover:bg-black/5 hover:opacity-100; }
    .alert-info    { @apply border-sky-200 bg-sky-50 text-sky-800 dark:border-sky-900 dark:bg-sky-950/40 dark:text-sky-200; }
    .alert-success { @apply border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-900 dark:bg-emerald-950/40 dark:text-emerald-200; }
    .alert-warning { @apply border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-200; }
    .alert-danger  { @apply border-red-200 bg-red-50 text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200; }
    .alert-brand   { @apply border-brand-200 bg-brand-50 text-brand-800 dark:border-brand-800 dark:bg-brand-900/40 dark:text-brand-100; }

    /* =====================================================================
     * CARD / STAT
     * ===================================================================== */
    .card { @apply min-w-0 rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900; }
    .card-hover { @apply transition hover:-translate-y-0.5 hover:shadow-soft; }
    .card-header { @apply flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-5 py-4 dark:border-slate-800; }
    .card-title { @apply text-base font-semibold text-slate-900 dark:text-white; }
    .card-subtitle { @apply mt-0.5 text-xs text-slate-500 dark:text-slate-400; }
    .card-body { @apply p-5; }
    .card-footer { @apply flex items-center justify-end gap-2 rounded-b-xl border-t border-slate-200 bg-slate-50/70 px-5 py-3 dark:border-slate-800 dark:bg-slate-900/60; }
    .card-brand { @apply border-brand-900 bg-brand-900 text-white; }

    .stat { @apply flex items-start gap-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900; }
    .stat-icon { @apply grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-brand-50 text-lg text-brand-700 dark:bg-brand-900/50 dark:text-brand-200; }
    .stat-label { @apply text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400; }
    .stat-value { @apply mt-1 text-2xl font-bold tracking-tight text-slate-900 dark:text-white; }
    .stat-meta  { @apply mt-1 flex items-center gap-1.5 text-xs text-slate-500; }
    .trend-up   { @apply inline-flex items-center gap-1 font-semibold text-emerald-600 dark:text-emerald-400; }
    .trend-down { @apply inline-flex items-center gap-1 font-semibold text-red-600 dark:text-red-400; }

    /* =====================================================================
     * FORM  (v1.5 – tham khảo shadcn/ui)
     * ===================================================================== */
    .form-group { @apply flex flex-col gap-2; }
    .form-label { @apply block text-sm font-medium leading-none text-slate-900 dark:text-slate-100; }
    .form-label.required::after { content: ' *'; @apply font-normal text-red-500; }
    .form-label .optional { @apply ml-1 font-normal text-slate-400; }
    .form-help  { @apply text-[13px] leading-snug text-slate-500 dark:text-slate-400; }
    .form-error { @apply flex items-center gap-1.5 text-[13px] leading-snug text-red-600 dark:text-red-400; }

    .form-control {
      @apply block h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm text-slate-900 shadow-[0_1px_2px_rgba(15,23,42,.05)]
             outline-none transition-[border-color,box-shadow] duration-150 placeholder:text-slate-400
             hover:border-slate-300
             focus:border-brand-600 focus:shadow-none focus:ring-[3px] focus:ring-brand-600/15
             disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-400 disabled:shadow-none
             dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500 dark:hover:border-slate-600
             dark:focus:border-brand-400 dark:focus:ring-brand-400/20 dark:disabled:bg-slate-800/60;
    }
    /* <select> luôn khớp :read-only trong trình duyệt -> chỉ áp kiểu chỉ-đọc cho input/textarea */
    input.form-control:read-only, textarea.form-control:read-only { @apply bg-slate-50 shadow-none dark:bg-slate-800/60; }
    textarea.form-control { @apply h-auto min-h-[88px] py-2 leading-relaxed; }
    select.form-control, select.form-select { @apply cursor-pointer appearance-none pr-9; }
    select[multiple].form-control { @apply h-auto bg-none py-1.5 pr-3; }
    .form-control-sm { @apply h-8 rounded-md px-2.5 text-[13px]; }
    .form-control-lg { @apply h-11 rounded-lg px-4 text-base; }
    .form-control.is-invalid { @apply border-red-500 hover:border-red-500 focus:border-red-500 focus:ring-red-500/15 dark:border-red-500; }
    .form-control.is-valid   { @apply border-emerald-500 focus:border-emerald-500 focus:ring-emerald-500/15; }

    /* Input có icon (icon nằm trong ô) */
    .input-icon { @apply relative; }
    .input-icon > i, .input-icon > .input-icon-el { @apply pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] text-slate-400; }
    .input-icon > .form-control { @apply pl-9; }
    .input-icon.input-icon-right > i, .input-icon.input-icon-right > .input-icon-el { @apply left-auto right-3; }
    .input-icon.input-icon-right > .form-control { @apply pl-3 pr-9; }
    .input-icon:focus-within > i { @apply text-brand-600 dark:text-brand-400; }
    .input-action { @apply absolute right-1.5 top-1/2 grid h-7 w-7 -translate-y-1/2 place-items-center rounded-md text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800; }

    /* Input group (addon gắn liền trước/sau) */
    .input-group { @apply flex w-full items-stretch rounded-lg shadow-[0_1px_2px_rgba(15,23,42,.05)]; }
    .input-group > .form-control { @apply min-w-0 flex-1 rounded-none shadow-none first:rounded-l-lg last:rounded-r-lg focus:z-10; }
    .input-group > .input-group-text, .input-group > .btn { @apply h-auto rounded-none shadow-none first:rounded-l-lg last:rounded-r-lg; }
    .input-group > *:not(:first-child) { @apply -ml-px; }
    .input-group-text { @apply inline-flex items-center whitespace-nowrap border border-slate-200 bg-slate-50 px-3 text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400; }

    /* Input box: 1 khung, bên trong chứa icon / chữ / nút / phím tắt (shadcn InputGroup)
       <div class="input-box"><span class="input-addon"><i class="fa-solid fa-magnifying-glass"></i></span><input placeholder="Tìm..."><span class="kbd">Ctrl K</span></div> */
    .input-box { @apply flex min-h-9 w-full items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-[0_1px_2px_rgba(15,23,42,.05)] transition-[border-color,box-shadow] duration-150 hover:border-slate-300 focus-within:border-brand-600 focus-within:shadow-none focus-within:ring-[3px] focus-within:ring-brand-600/15 dark:border-slate-700 dark:bg-slate-900 dark:focus-within:border-brand-400 dark:focus-within:ring-brand-400/20; }
    .input-box > input, .input-box > textarea, .input-box > select { @apply h-9 min-w-0 flex-1 border-0 bg-transparent p-0 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:ring-0 dark:text-slate-100; }
    .input-box > textarea { @apply h-auto min-h-[72px] resize-none py-2.5 leading-relaxed; }
    .input-addon { @apply inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap text-sm text-slate-400; }
    .input-box > .btn { @apply -mr-1.5 h-7 px-2.5 text-xs; }
    .input-box > .btn-icon { @apply w-7 px-0; }
    .input-box.is-invalid { @apply border-red-500 focus-within:border-red-500 focus-within:ring-red-500/15; }
    .input-box-col { @apply flex-col items-stretch gap-0 px-0; }
    .input-box-col > textarea { @apply px-3; }
    .input-box-footer { @apply flex items-center gap-2 border-t border-slate-100 px-2 py-1.5 dark:border-slate-800; }

    /* Checkbox / Radio tự vẽ (đồng nhất trên mọi trình duyệt) */
    .form-check { @apply inline-flex cursor-pointer select-none items-center gap-2.5 text-sm text-slate-800 dark:text-slate-200; }
    .form-check:has(:disabled) { @apply cursor-not-allowed opacity-50; }
    .form-check-input {
      @apply grid h-4 w-4 shrink-0 cursor-pointer appearance-none place-content-center rounded-[5px] border border-slate-300 bg-white shadow-[0_1px_2px_rgba(15,23,42,.06)] transition
             hover:border-slate-400 focus:outline-none focus-visible:ring-[3px] focus-visible:ring-brand-600/25
             checked:border-brand-700 checked:bg-brand-700 indeterminate:border-brand-700 indeterminate:bg-brand-700
             disabled:cursor-not-allowed dark:border-slate-600 dark:bg-slate-900 dark:checked:border-brand-500 dark:checked:bg-brand-500;
    }
    .form-check-input[type=checkbox]:checked { background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3e%3c/svg%3e"); background-size: 100% 100%; }
    .form-check-input[type=checkbox]:indeterminate { background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M4.5 8h7' stroke='white' stroke-width='2' stroke-linecap='round'/%3e%3c/svg%3e"); background-size: 100% 100%; }
    .form-check-input[type=radio] { @apply rounded-full checked:bg-white checked:shadow-[inset_0_0_0_4px_theme(colors.brand.700)] dark:checked:bg-slate-900 dark:checked:shadow-[inset_0_0_0_4px_theme(colors.brand.500)]; }
    .form-check-input.is-invalid { @apply border-red-500; }

    /* Checkbox / radio kèm mô tả */
    .check-item { @apply flex cursor-pointer gap-3; }
    .check-item > .form-check-input, .check-item > .form-switch { @apply mt-0.5; }
    .check-item-title { @apply text-sm font-medium leading-5 text-slate-900 dark:text-slate-100; }
    .check-item-desc { @apply mt-0.5 text-[13px] leading-snug text-slate-500 dark:text-slate-400; }

    .form-switch {
      @apply relative h-5 w-9 shrink-0 cursor-pointer appearance-none rounded-full bg-slate-200 shadow-inner transition-colors duration-200
             before:absolute before:left-0.5 before:top-0.5 before:h-4 before:w-4 before:rounded-full before:bg-white before:shadow-[0_1px_3px_rgba(15,23,42,.25)] before:transition-transform before:duration-200 before:content-['']
             checked:bg-brand-700 checked:before:translate-x-4
             focus:outline-none focus-visible:ring-[3px] focus-visible:ring-brand-600/25
             disabled:cursor-not-allowed disabled:opacity-50 dark:bg-slate-700 dark:checked:bg-brand-500;
    }
    .form-switch-lg { @apply h-6 w-11 before:h-5 before:w-5 checked:before:translate-x-5; }
    .form-range { @apply w-full cursor-pointer accent-brand-700; }
    .form-file {
      @apply block w-full cursor-pointer rounded-lg border border-slate-200 bg-white py-1 pl-1 text-sm text-slate-500 shadow-[0_1px_2px_rgba(15,23,42,.05)] hover:border-slate-300
             file:mr-3 file:h-7 file:cursor-pointer file:rounded-md file:border-0 file:bg-slate-100 file:px-3 file:text-[13px] file:font-medium file:text-slate-700
             hover:file:bg-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400 dark:file:bg-slate-800 dark:file:text-slate-200;
    }

    /* Field / Fieldset – bố cục form (shadcn Field) */
    .field { @apply flex flex-col gap-2; }
    .field-desc { @apply text-[13px] leading-snug text-slate-500 dark:text-slate-400; }
    .field-horizontal { @apply flex-col gap-3 sm:flex-row sm:items-center sm:justify-between sm:gap-6; }
    .field-horizontal > .field-content { @apply flex min-w-0 flex-1 flex-col gap-1.5; }
    .field-horizontal > :last-child:not(.field-content):not(.form-switch):not(.form-check-input):not(.segmented) { @apply sm:w-72 sm:shrink-0; }
    .fieldset { @apply flex flex-col gap-6; }
    .fieldset + .fieldset { @apply border-t border-slate-200 pt-6 dark:border-slate-800; }
    .fieldset-legend { @apply text-base font-semibold text-slate-900 dark:text-white; }
    .fieldset-desc { @apply -mt-4 text-sm text-slate-500 dark:text-slate-400; }
    .field-separator { @apply h-px bg-slate-200 dark:bg-slate-800; }

    /* Option card (radio / checkbox dạng thẻ) */
    .option-card { @apply relative flex cursor-pointer gap-3 rounded-lg border border-slate-200 bg-white p-4 shadow-[0_1px_2px_rgba(15,23,42,.05)] transition hover:border-slate-300 has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50/50 has-[:checked]:shadow-[0_0_0_1px_theme(colors.brand.600)] has-[:focus-visible]:ring-[3px] has-[:focus-visible]:ring-brand-600/20 dark:border-slate-700 dark:bg-slate-900 dark:has-[:checked]:border-brand-400 dark:has-[:checked]:bg-brand-900/30 dark:has-[:checked]:shadow-[0_0_0_1px_theme(colors.brand.400)]; }

    /* Dropzone upload */
    .dropzone { @apply flex cursor-pointer flex-col items-center justify-center gap-2 rounded-lg border border-dashed border-slate-300 bg-slate-50/60 px-6 py-8 text-center transition hover:border-brand-500 hover:bg-brand-50/40 dark:border-slate-700 dark:bg-slate-900; }
    .dropzone.is-dragover { @apply border-brand-600 bg-brand-50 dark:bg-brand-900/30; }
    .dropzone-icon { @apply grid h-10 w-10 place-items-center rounded-lg border border-slate-200 bg-white text-base text-slate-500 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300; }
    .file-list { @apply mt-3 space-y-2; }
    .file-item { @apply flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-900; }

    /* Tag input */
    .tag-input { @apply flex min-h-9 w-full cursor-text flex-wrap items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-1.5 py-1 shadow-[0_1px_2px_rgba(15,23,42,.05)] transition hover:border-slate-300 focus-within:border-brand-600 focus-within:ring-[3px] focus-within:ring-brand-600/15 dark:border-slate-700 dark:bg-slate-900; }
    .tag-input > input { @apply min-w-[120px] flex-1 border-0 bg-transparent px-1 py-0.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:ring-0 dark:text-slate-100; }

    /* Number stepper */
    .number-input { @apply inline-flex h-9 items-stretch overflow-hidden rounded-lg border border-slate-200 bg-white shadow-[0_1px_2px_rgba(15,23,42,.05)] focus-within:border-brand-600 focus-within:ring-[3px] focus-within:ring-brand-600/15 dark:border-slate-700 dark:bg-slate-900; }
    .number-input > button { @apply w-9 text-slate-500 hover:bg-slate-50 hover:text-slate-800 dark:hover:bg-slate-800; }
    .number-input > input { @apply w-16 border-x border-slate-200 bg-transparent text-center text-sm tabular-nums text-slate-900 outline-none [appearance:textfield] dark:border-slate-700 dark:text-white [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none; }

    /* Combobox (select có tìm kiếm) */
    .combo { @apply relative; }
    .combo-toggle { @apply flex h-9 w-full cursor-pointer items-center justify-between gap-2 rounded-lg border border-slate-200 bg-white px-3 text-left text-sm text-slate-900 shadow-[0_1px_2px_rgba(15,23,42,.05)] outline-none transition hover:border-slate-300 focus:border-brand-600 focus:ring-[3px] focus:ring-brand-600/15 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100; }
    .combo.open .combo-toggle { @apply border-brand-600 ring-[3px] ring-brand-600/15; }
    .combo-toggle .placeholder { @apply text-slate-400; }
    .combo-panel { @apply absolute left-0 right-0 z-50 mt-1.5 hidden animate-dropdown-in rounded-lg border border-slate-200 bg-white p-1 shadow-lg dark:border-slate-700 dark:bg-slate-800; }
    .combo.open .combo-panel { @apply block; }
    .combo-search { @apply mb-1 h-8 w-full rounded-md border-0 border-b border-slate-100 bg-transparent px-2.5 text-sm outline-none placeholder:text-slate-400 dark:border-slate-700 dark:text-white; }
    .combo-list { @apply max-h-60 overflow-y-auto; }
    .combo-option { @apply flex cursor-pointer items-center justify-between gap-2 rounded-md px-2.5 py-1.5 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700; }
    .combo-option.highlight { @apply bg-slate-100 dark:bg-slate-700; }
    .combo-option.selected { @apply font-medium text-brand-800 dark:text-brand-100; }
    .combo-empty { @apply px-3 py-4 text-center text-sm text-slate-400; }

    /* Form section (tiêu đề + mô tả bên trái, các trường bên phải) */
    .form-section { @apply grid grid-cols-1 gap-x-8 gap-y-5 border-b border-slate-200 py-7 first:pt-0 last:border-0 last:pb-0 md:grid-cols-3 dark:border-slate-800; }
    .form-section-title { @apply text-sm font-semibold text-slate-900 dark:text-white; }
    .form-section-desc { @apply mt-1 text-[13px] leading-snug text-slate-500; }
    .form-actions { @apply flex flex-col-reverse gap-2 border-t border-slate-200 pt-5 sm:flex-row sm:justify-end dark:border-slate-800; }

    /* =====================================================================
     * TABLE
     * ===================================================================== */
    .table-wrapper { @apply w-full overflow-x-auto rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900; }
    .table { @apply w-full border-collapse text-left text-sm; }
    .table thead th { @apply whitespace-nowrap border-b border-slate-200 bg-slate-50 px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:border-slate-800 dark:bg-slate-800/60 dark:text-slate-400; }
    .table tbody td { @apply border-b border-slate-100 px-4 py-3 align-middle text-slate-700 dark:border-slate-800 dark:text-slate-300; }
    .table tbody tr:last-child td { @apply border-b-0; }
    .table tfoot td { @apply border-t border-slate-200 bg-slate-50 px-4 py-3 font-semibold dark:border-slate-800 dark:bg-slate-800/60; }
    .table-hover tbody tr { @apply transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50; }
    .table-striped tbody tr:nth-child(even) { @apply bg-slate-50/70 dark:bg-slate-800/30; }
    .table-compact thead th, .table-compact tbody td { @apply px-3 py-2; }
    .table-bordered thead th, .table-bordered tbody td { @apply border border-slate-200 dark:border-slate-800; }
    .table-sticky thead th { @apply sticky top-0 z-10; }
    .table tr.selected td { @apply bg-brand-50/70 dark:bg-brand-900/30; }
    .table th.sortable { @apply cursor-pointer select-none hover:text-slate-800 dark:hover:text-white; }
    .table th .sort-icon { @apply ml-1 text-[10px] opacity-40; }
    .table th.sorted .sort-icon { @apply text-brand-700 opacity-100 dark:text-accent-400; }

    /* DataTable (TXTV.DataTable) */
    .dt { @apply space-y-3; }
    .dt-toolbar { @apply flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between; }
    .dt-footer { @apply flex flex-col items-center justify-between gap-2 text-xs text-slate-500 sm:flex-row; }

    /* =====================================================================
     * APP SHELL: SIDEBAR + TOPBAR
     * ===================================================================== */
    .app-sidebar { @apply fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col bg-brand-950 text-white transition-[transform,width] duration-200 lg:translate-x-0; }
    .app.sidebar-open .app-sidebar { @apply translate-x-0; }
    .app-backdrop { @apply fixed inset-0 z-30 hidden bg-slate-900/50 lg:hidden; }
    .app.sidebar-open .app-backdrop { @apply block animate-fade-in; }
    .app-main { @apply flex min-h-screen flex-col transition-[padding] duration-200 lg:pl-64; }
    .app-topbar { @apply sticky top-0 z-20 flex h-14 shrink-0 items-center gap-3 border-b border-slate-200 bg-white/85 px-4 backdrop-blur lg:px-6 dark:border-slate-800 dark:bg-slate-900/85; }
    .app-content { @apply mx-auto w-full max-w-screen-2xl flex-1 p-4 lg:p-6; }
    .app-footer { @apply border-t border-slate-200 px-4 py-3 text-center text-xs text-slate-400 lg:px-6 dark:border-slate-800; }

    .sidebar-brand { @apply flex h-14 shrink-0 items-center gap-3 border-b border-white/10 px-4; }
    .sidebar-logo { @apply grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-white text-sm font-extrabold text-brand-900; }
    .sidebar-brand-text { @apply min-w-0 leading-tight; }
    .sidebar-nav { @apply flex-1 space-y-0.5 overflow-y-auto px-3 py-3; }
    .sidebar-footer { @apply shrink-0 border-t border-white/10 p-3; }
    .nav-section-title { @apply px-3 pb-1 pt-4 text-[11px] font-semibold uppercase tracking-wider text-white/40; }
    .nav-link { @apply flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-white/70 transition-colors hover:bg-white/10 hover:text-white; }
    .nav-link > i { @apply w-5 shrink-0 text-center text-[15px]; }
    .nav-link.active { @apply bg-accent-400 font-semibold text-brand-950 hover:bg-accent-400; }
    .nav-link .nav-badge { @apply ml-auto rounded-full bg-white/15 px-2 py-0.5 text-[10px] font-semibold; }

    /* Sidebar thu gọn (desktop) */
    .app.sidebar-collapsed .app-sidebar { @apply lg:w-[72px]; }
    .app.sidebar-collapsed .app-main { @apply lg:pl-[72px]; }
    .app.sidebar-collapsed .nav-label,
    .app.sidebar-collapsed .sidebar-brand-text,
    .app.sidebar-collapsed .nav-section-title,
    .app.sidebar-collapsed .nav-badge,
    .app.sidebar-collapsed .sidebar-hide-collapsed { @apply lg:hidden; }
    .app.sidebar-collapsed .nav-link { @apply lg:justify-center; }

    /* Navbar ngang (không dùng sidebar) */
    .navbar { @apply flex h-14 items-center gap-4 bg-brand-900 px-4 text-white lg:px-6; }
    .navbar-link { @apply rounded-md px-3 py-1.5 text-sm text-white/75 hover:bg-white/10 hover:text-white; }
    .navbar-link.active { @apply bg-white/15 text-white; }

    /* Page header */
    .page-header { @apply mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between; }
    .page-title { @apply text-xl font-bold tracking-tight text-slate-900 dark:text-white; }
    .page-subtitle { @apply mt-0.5 text-sm text-slate-500 dark:text-slate-400; }

    /* =====================================================================
     * BREADCRUMB / TABS / PAGINATION / STEPS
     * ===================================================================== */
    .breadcrumb { @apply flex flex-wrap items-center gap-1.5 text-sm text-slate-500 dark:text-slate-400; }
    .breadcrumb > li { @apply inline-flex items-center gap-1.5; }
    .breadcrumb > li + li::before { content: '\f105'; font-family: 'Font Awesome 6 Free'; font-weight: 900; @apply text-[10px] text-slate-300 dark:text-slate-600; }
    .breadcrumb a { @apply hover:text-brand-700 dark:hover:text-accent-400; }
    .breadcrumb > li:last-child { @apply font-medium text-slate-800 dark:text-slate-200; }

    .tabs { @apply flex gap-1 overflow-x-auto border-b border-slate-200 dark:border-slate-800; }
    .tab { @apply -mb-px inline-flex cursor-pointer items-center gap-2 whitespace-nowrap border-b-2 border-transparent px-4 py-2.5 text-sm font-medium text-slate-500 transition-colors hover:border-slate-300 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200; }
    .tab.active { @apply border-brand-700 text-brand-700 dark:border-accent-400 dark:text-accent-400; }
    .tab .badge { @apply py-0; }
    .tabs-pills { @apply inline-flex w-auto gap-1 rounded-lg border-0 bg-slate-100 p-1 dark:bg-slate-800; }
    .tabs-pills .tab { @apply mb-0 rounded-md border-0 px-3 py-1.5; }
    .tabs-pills .tab.active { @apply bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white; }
    .tab-panel { @apply hidden; }
    .tab-panel.active { @apply block animate-fade-in; }

    .pagination { @apply flex flex-wrap items-center gap-1; }
    .page-link { @apply inline-flex h-8 min-w-[2rem] cursor-pointer items-center justify-center rounded-lg px-2 text-sm text-slate-600 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800; }
    .page-link.active { @apply bg-brand-700 font-semibold text-white hover:bg-brand-700; }
    .page-link.disabled { @apply pointer-events-none opacity-40; }
    .page-ellipsis { @apply px-1 text-slate-400; }

    .steps { @apply flex w-full items-center; }
    .step { @apply flex items-center gap-2.5 text-sm; }
    .step:not(:last-child) { @apply flex-1; }
    .step:not(:last-child)::after { content: ''; @apply mx-3 h-0.5 flex-1 rounded bg-slate-200 dark:bg-slate-700; }
    .step-index { @apply grid h-8 w-8 shrink-0 place-items-center rounded-full border-2 border-slate-300 bg-white text-xs font-semibold text-slate-500 transition dark:border-slate-600 dark:bg-slate-900; }
    .step-label { @apply hidden whitespace-nowrap font-medium text-slate-500 sm:block; }
    .step.active .step-index { @apply border-brand-700 text-brand-700 ring-4 ring-brand-100 dark:border-accent-400 dark:text-accent-400 dark:ring-brand-900; }
    .step.active .step-label { @apply text-slate-900 dark:text-white; }
    .step.done .step-index { @apply border-brand-700 bg-brand-700 text-white; }
    .step.done::after { @apply bg-brand-700; }

    /* =====================================================================
     * DROPDOWN
     * ===================================================================== */
    .dropdown { @apply relative inline-block; }
    .dropdown-menu { @apply absolute right-0 top-full z-50 mt-1.5 hidden min-w-[12rem] origin-top-right animate-dropdown-in rounded-xl bg-white p-1 shadow-lg ring-1 ring-black/5 dark:bg-slate-800 dark:ring-white/10; }
    .dropdown-menu.dropdown-left { @apply left-0 right-auto origin-top-left; }
    .dropdown-menu.dropdown-up { @apply bottom-full top-auto mb-1.5 mt-0; }
    .dropdown.open > .dropdown-menu { @apply block; }
    .dropdown-item { @apply flex w-full cursor-pointer items-center gap-2.5 rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700; }
    .dropdown-item > i { @apply w-4 text-center text-slate-400; }
    .dropdown-item.danger { @apply text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/40; }
    .dropdown-item.danger > i { @apply text-red-500; }
    .dropdown-divider { @apply my-1 h-px bg-slate-100 dark:bg-slate-700; }
    .dropdown-header { @apply px-3 pb-1 pt-2 text-[11px] font-semibold uppercase tracking-wide text-slate-400; }

    /* =====================================================================
     * MODAL / DRAWER
     * ===================================================================== */
    .modal { @apply fixed inset-0 z-[100] hidden items-start justify-center overflow-y-auto p-4 sm:items-center; }
    .modal.open { @apply flex; }
    .modal-backdrop { @apply fixed inset-0 animate-fade-in bg-slate-900/50 backdrop-blur-[2px]; }
    .modal-dialog { @apply relative my-8 flex max-h-[calc(100vh-4rem)] w-full max-w-lg animate-modal-in flex-col rounded-2xl bg-white shadow-2xl dark:bg-slate-900 dark:ring-1 dark:ring-white/10; }
    .modal-sm .modal-dialog { @apply max-w-sm; }
    .modal-lg .modal-dialog { @apply max-w-3xl; }
    .modal-xl .modal-dialog { @apply max-w-5xl; }
    .modal-full .modal-dialog { @apply max-w-[96vw]; }
    .modal-header { @apply flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 px-6 py-4 dark:border-slate-800; }
    .modal-title { @apply text-lg font-semibold text-slate-900 dark:text-white; }
    .modal-body { @apply overflow-y-auto px-6 py-5; }
    .modal-footer { @apply flex shrink-0 items-center justify-end gap-2 rounded-b-2xl border-t border-slate-200 bg-slate-50 px-6 py-3.5 dark:border-slate-800 dark:bg-slate-900; }
    .modal-close { @apply -mr-2 grid h-8 w-8 place-items-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800; }

    /* Dialog (alert / confirm / prompt) */
    .dialog { @apply max-w-[28rem] overflow-hidden rounded-xl; }
    .dialog-head { @apply flex gap-4 px-6 pb-5 pt-6; }
    .dialog-main { @apply min-w-0 flex-1 pt-1.5; }
    .dialog.no-icon .dialog-main { @apply pt-0; }
    .dialog-icon { @apply grid h-10 w-10 shrink-0 place-items-center rounded-full text-[15px] ring-[6px]; }
    .dialog-icon.info     { @apply bg-sky-100 text-sky-700 ring-sky-50 dark:bg-sky-950 dark:text-sky-300 dark:ring-sky-950/40; }
    .dialog-icon.success  { @apply bg-emerald-100 text-emerald-700 ring-emerald-50 dark:bg-emerald-950 dark:text-emerald-300 dark:ring-emerald-950/40; }
    .dialog-icon.warning  { @apply bg-amber-100 text-amber-700 ring-amber-50 dark:bg-amber-950 dark:text-amber-300 dark:ring-amber-950/40; }
    .dialog-icon.danger   { @apply bg-red-100 text-red-600 ring-red-50 dark:bg-red-950 dark:text-red-300 dark:ring-red-950/40; }
    .dialog-icon.question { @apply bg-brand-100 text-brand-700 ring-brand-50 dark:bg-brand-900 dark:text-brand-100 dark:ring-brand-900/40; }
    .dialog-title { @apply text-[17px] font-semibold leading-6 text-slate-900 dark:text-white; }
    .dialog-text { @apply mt-1.5 text-sm leading-relaxed text-slate-600 dark:text-slate-400; }
    .dialog-details { @apply mt-4 grid grid-cols-[auto_1fr] gap-x-4 gap-y-1.5 rounded-lg border border-slate-200 bg-slate-50 px-3.5 py-3 text-[13px] dark:border-slate-700 dark:bg-slate-800/60; }
    .dialog-details dt { @apply text-slate-500; }
    .dialog-details dd { @apply truncate text-right font-medium text-slate-900 dark:text-slate-100; }
    .dialog-footer { @apply flex flex-col-reverse gap-2 border-t border-slate-200 bg-slate-50 px-6 py-3.5 sm:flex-row sm:justify-end dark:border-slate-800 dark:bg-slate-900/60; }
    .dialog-footer .btn { @apply w-full sm:w-auto; }

    .drawer { @apply fixed inset-0 z-[100] hidden; }
    .drawer.open { @apply block; }
    .drawer-panel { @apply fixed inset-y-0 right-0 flex w-full max-w-md animate-slide-in-right flex-col bg-white shadow-2xl dark:bg-slate-900; }
    .drawer-left .drawer-panel { @apply left-0 right-auto animate-slide-in-left; }
    .drawer-lg .drawer-panel { @apply max-w-2xl; }
    .drawer-header { @apply flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 px-5 py-4 dark:border-slate-800; }
    .drawer-body { @apply flex-1 overflow-y-auto p-5; }
    .drawer-footer { @apply flex shrink-0 justify-end gap-2 border-t border-slate-200 px-5 py-3 dark:border-slate-800; }

    /* =====================================================================
     * TOAST / LOADING / SPINNER / PROGRESS / SKELETON
     * ===================================================================== */
    .toast-container { @apply pointer-events-none fixed right-4 top-4 z-[200] flex w-[calc(100%-2rem)] max-w-[23rem] flex-col gap-2.5; }
    .toast-container.bottom { @apply bottom-4 top-auto flex-col-reverse; }
    .toast { @apply pointer-events-auto relative flex animate-toast-in touch-pan-y select-none items-start gap-3 overflow-hidden rounded-xl border border-slate-200/80 bg-white py-3 pl-3 pr-2 text-sm leading-5 shadow-[0_12px_32px_-12px_rgba(15,23,42,.28),0_2px_6px_-2px_rgba(15,23,42,.08)] transition duration-200 dark:border-slate-700 dark:bg-slate-800; }
    .toast.is-leaving { @apply scale-95 opacity-0; }
    .toast-icon { @apply grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-slate-100 text-[12px] text-slate-600 ring-1 ring-inset ring-slate-900/5 dark:bg-slate-700 dark:text-slate-200; }
    .toast-success .toast-icon { @apply bg-emerald-50 text-emerald-600 ring-emerald-600/15 dark:bg-emerald-950 dark:text-emerald-400; }
    .toast-error   .toast-icon { @apply bg-red-50 text-red-600 ring-red-600/15 dark:bg-red-950 dark:text-red-400; }
    .toast-warning .toast-icon { @apply bg-amber-50 text-amber-600 ring-amber-600/20 dark:bg-amber-950 dark:text-amber-400; }
    .toast-info    .toast-icon { @apply bg-sky-50 text-sky-600 ring-sky-600/15 dark:bg-sky-950 dark:text-sky-400; }
    .toast-loading .toast-icon { @apply bg-brand-50 text-brand-700 ring-brand-700/15 dark:bg-brand-900/60 dark:text-accent-400; }
    .toast-body { @apply min-w-0 flex-1 pt-1; }
    .toast-title { @apply font-semibold text-slate-900 dark:text-white; }
    .toast-text { @apply text-[13px] text-slate-600 dark:text-slate-300; }
    .toast-body > .toast-text:first-child { @apply text-sm font-medium text-slate-800 dark:text-slate-100; }
    .toast-count { @apply mt-1 shrink-0 rounded-full bg-slate-100 px-1.5 text-[11px] font-semibold tabular-nums leading-5 text-slate-600 dark:bg-slate-700 dark:text-slate-200; }
    .toast-close { @apply mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-md text-[11px] text-slate-400 opacity-0 transition hover:bg-slate-100 hover:text-slate-700 focus:opacity-100 dark:hover:bg-slate-700; }
    .toast:hover .toast-close { @apply opacity-100; }
    @media (hover: none) { .toast-close { @apply opacity-100; } }
    .toast-progress { @apply absolute bottom-0 left-0 h-[2px] w-full origin-left bg-slate-300 dark:bg-slate-600; animation: tv-toast-timer linear forwards; }
    .toast-success .toast-progress { @apply bg-emerald-500/70; }
    .toast-error   .toast-progress { @apply bg-red-500/70; }
    .toast-warning .toast-progress { @apply bg-amber-500/70; }
    .toast-info    .toast-progress { @apply bg-sky-500/60; }
    .toast:hover .toast-progress, .toast:focus-within .toast-progress { animation-play-state: paused; }
    /* Snackbar (toast có nút thao tác) – nền tối */
    .toast-snack { @apply items-center border-slate-900 bg-slate-900 pl-4 text-white dark:border-slate-600 dark:bg-slate-700; }
    .toast-snack .toast-icon { @apply bg-white/10 text-white ring-white/10; }
    .toast-snack .toast-body { @apply pt-0; }
    .toast-snack .toast-body > .toast-text:first-child, .toast-snack .toast-title { @apply text-white; }
    .toast-snack .toast-text { @apply text-white/70; }
    .toast-snack .toast-close { @apply mt-0 text-white/50 hover:bg-white/10 hover:text-white; }
    .toast-snack .toast-progress { @apply bg-accent-400/80; }

    .loading-overlay { @apply fixed inset-0 z-[300] flex animate-fade-in flex-col items-center justify-center gap-3 bg-white/70 backdrop-blur-sm dark:bg-slate-950/70; }
    .loading-box { @apply flex flex-col items-center gap-3 rounded-2xl bg-white px-8 py-6 shadow-xl ring-1 ring-black/5 dark:bg-slate-800; }
    .loading-text { @apply text-sm font-medium text-slate-600 dark:text-slate-300; }
    .loading-block { @apply relative; }
    .loading-block > .loading-mask { @apply absolute inset-0 z-10 grid place-items-center rounded-[inherit] bg-white/70 dark:bg-slate-900/70; }

    .spinner { @apply inline-block h-5 w-5 shrink-0 animate-spin rounded-full border-2 border-current border-r-transparent align-[-0.125em]; }
    .spinner-sm { @apply h-3.5 w-3.5; }
    .spinner-lg { @apply h-8 w-8 border-[3px]; }
    .spinner-xl { @apply h-12 w-12 border-4 text-brand-700; }

    .progress { @apply h-2 w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800; }
    .progress-sm { @apply h-1; }
    .progress-lg { @apply h-4 text-[10px]; }
    .progress-bar { @apply flex h-full items-center justify-center rounded-full bg-brand-700 font-semibold text-white transition-[width] duration-500; }
    .progress-bar.accent  { @apply bg-accent-400 text-brand-950; }
    .progress-bar.success { @apply bg-emerald-500; }
    .progress-bar.warning { @apply bg-amber-500; }
    .progress-bar.danger  { @apply bg-red-500; }
    .progress-bar.info    { @apply bg-sky-500; }
    .progress-striped .progress-bar { background-image: linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.18) 75%, transparent 75%, transparent); background-size: 1rem 1rem; @apply animate-progress-stripes; }
    .progress-indeterminate .progress-bar { @apply w-2/5 animate-indeterminate; }

    .progress-ring { @apply relative inline-grid place-items-center; }
    .progress-ring svg { @apply -rotate-90; }
    .progress-ring-value { @apply absolute text-sm font-bold text-slate-900 dark:text-white; }

    .skeleton { @apply animate-pulse rounded-md bg-slate-200 dark:bg-slate-800; }

    /* =====================================================================
     * DATA DISPLAY
     * ===================================================================== */
    .avatar { @apply relative inline-flex h-9 w-9 shrink-0 select-none items-center justify-center rounded-full bg-brand-100 text-sm font-semibold uppercase text-brand-800 dark:bg-brand-900 dark:text-brand-100; }
    .avatar > img { @apply h-full w-full rounded-[inherit] object-cover; }
    .avatar-xs { @apply h-6 w-6 text-[10px]; }
    .avatar-sm { @apply h-8 w-8 text-xs; }
    .avatar-lg { @apply h-12 w-12 text-base; }
    .avatar-xl { @apply h-16 w-16 text-xl; }
    .avatar-square { @apply rounded-lg; }
    .avatar-group { @apply flex -space-x-2; }
    .avatar-group > .avatar { @apply ring-2 ring-white dark:ring-slate-900; }
    .avatar-online::after, .avatar-offline::after, .avatar-busy::after { content: ''; @apply absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full ring-2 ring-white dark:ring-slate-900; }
    .avatar-online::after  { @apply bg-emerald-500; }
    .avatar-offline::after { @apply bg-slate-400; }
    .avatar-busy::after    { @apply bg-red-500; }

    .list-group { @apply divide-y divide-slate-100 overflow-hidden rounded-xl border border-slate-200 bg-white dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900; }
    /* .list-item trùng tên utility 'list-item' (display: list-item) của Tailwind -> tăng độ ưu tiên để luôn là flex */
    .list-item.list-item, .list-group > .list-item { @apply flex items-center gap-3 px-4 py-3; }
    .list-item-action { @apply cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/60; }
    .list-item.active { @apply bg-brand-50 dark:bg-brand-900/30; }

    .timeline { @apply relative space-y-6 pl-9 before:absolute before:bottom-2 before:left-[11px] before:top-2 before:w-0.5 before:bg-slate-200 before:content-[''] dark:before:bg-slate-800; }
    .timeline-item { @apply relative; }
    .timeline-dot { @apply absolute -left-9 top-0 grid h-6 w-6 place-items-center rounded-full bg-brand-700 text-[10px] text-white ring-4 ring-white dark:ring-slate-950; }
    .timeline-dot.success { @apply bg-emerald-500; }
    .timeline-dot.warning { @apply bg-amber-500; }
    .timeline-dot.danger  { @apply bg-red-500; }
    .timeline-dot.muted   { @apply bg-slate-300 dark:bg-slate-700; }
    .timeline-time { @apply text-xs text-slate-400; }
    .timeline-title { @apply font-medium text-slate-900 dark:text-white; }

    .accordion { @apply divide-y divide-slate-200 overflow-hidden rounded-xl border border-slate-200 bg-white dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900; }
    .accordion-trigger { @apply flex w-full items-center justify-between gap-3 px-5 py-4 text-left text-sm font-medium text-slate-900 transition-colors hover:bg-slate-50 dark:text-white dark:hover:bg-slate-800/60; }
    .accordion-icon { @apply text-xs text-slate-400 transition-transform duration-200; }
    .accordion-item.open .accordion-icon { @apply rotate-180; }
    .accordion-content { @apply hidden px-5 pb-4 text-sm leading-relaxed text-slate-600 dark:text-slate-400; }
    .accordion-item.open .accordion-content { @apply block animate-fade-in; }

    .desc-list { @apply grid grid-cols-1 gap-x-4 gap-y-3 text-sm sm:grid-cols-3; }
    .desc-list > dt { @apply text-slate-500 dark:text-slate-400; }
    .desc-list > dd { @apply font-medium text-slate-900 sm:col-span-2 dark:text-white; }

    .divider { @apply my-4 flex items-center gap-3 text-xs font-medium uppercase tracking-wide text-slate-400 before:h-px before:flex-1 before:bg-slate-200 before:content-[''] after:h-px after:flex-1 after:bg-slate-200 after:content-[''] dark:before:bg-slate-800 dark:after:bg-slate-800; }
    .divider-plain { @apply my-4 h-px bg-slate-200 dark:bg-slate-800; }

    .empty-state { @apply flex flex-col items-center justify-center px-4 py-12 text-center; }
    .empty-state-icon { @apply mb-4 grid h-16 w-16 place-items-center rounded-full bg-slate-100 text-2xl text-slate-400 dark:bg-slate-800; }
    .empty-state-title { @apply text-base font-semibold text-slate-900 dark:text-white; }
    .empty-state-text { @apply mt-1 max-w-sm text-sm text-slate-500; }

    .rating { @apply inline-flex items-center gap-0.5 text-amber-400; }
    .rating > i.off { @apply text-slate-300 dark:text-slate-700; }

    .callout { @apply rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300; }

    /* Login / Auth layout */
    .auth-wrap { @apply grid min-h-screen place-items-center bg-brand-950 p-4; }
    .auth-card { @apply w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl dark:bg-slate-900; }
    /* =====================================================================
     * MỞ RỘNG (v1.1)
     * ===================================================================== */

    /* Popover (dùng chung cơ chế dropdown) */
    .popover { @apply w-72 p-4 text-sm text-slate-600 dark:text-slate-300; }
    .popover-title { @apply mb-1 font-semibold text-slate-900 dark:text-white; }

    /* Banner thông báo đầu trang */
    .banner { @apply flex items-center gap-3 bg-brand-900 px-4 py-2.5 text-sm text-white lg:px-6; }
    .banner a { @apply font-semibold text-accent-300 underline-offset-2 hover:underline; }
    .banner-warning { @apply bg-amber-500 text-amber-950; }
    .banner-danger { @apply bg-red-600; }
    .banner-close { @apply ml-auto grid h-7 w-7 shrink-0 place-items-center rounded-md opacity-70 hover:bg-white/10 hover:opacity-100; }

    /* Segmented control: <div class="segmented"><label><input type="radio" name="x" checked><span>A</span></label>... */
    .segmented { @apply inline-flex rounded-lg bg-slate-100 p-1 dark:bg-slate-800; }
    .segmented > label { @apply relative cursor-pointer; }
    .segmented > label > input { @apply sr-only; }
    .segmented > label > span { @apply flex items-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium text-slate-500 transition hover:text-slate-800 dark:text-slate-400 dark:hover:text-white; }
    .segmented > label > input:checked + span { @apply bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white; }
    .segmented > label > input:focus-visible + span { @apply ring-2 ring-brand-500; }

    /* OTP / PIN */
    .otp { @apply flex gap-2; }
    .otp > input:not([type=hidden]) { @apply h-12 w-11 rounded-lg border border-slate-300 bg-white text-center text-lg font-semibold text-slate-900 shadow-sm outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20 dark:border-slate-700 dark:bg-slate-900 dark:text-white; }

    /* Rating có thể chọn */
    .rating-input { @apply cursor-pointer text-xl; }
    .rating-input > i { @apply transition-transform hover:scale-110; }

    /* Chữ ký */
    .signature-pad { @apply relative overflow-hidden rounded-xl border-2 border-dashed border-slate-300 bg-white dark:border-slate-700 dark:bg-slate-900; }
    .signature-pad > canvas { @apply block h-44 w-full cursor-crosshair touch-none; }
    .signature-pad > .signature-hint { @apply pointer-events-none absolute inset-x-0 bottom-3 text-center text-xs text-slate-400; }
    .signature-pad.has-signature > .signature-hint { @apply hidden; }

    /* Lightbox ảnh */
    .lightbox { @apply fixed inset-0 z-[250] flex animate-fade-in items-center justify-center bg-slate-950/90 p-4; }
    .lightbox img { @apply max-h-[85vh] max-w-full rounded-lg shadow-2xl; }
    .lightbox-btn { @apply absolute grid h-10 w-10 place-items-center rounded-full bg-white/10 text-white hover:bg-white/20; }
    .lightbox-caption { @apply absolute bottom-5 left-1/2 -translate-x-1/2 rounded-full bg-black/50 px-4 py-1.5 text-sm text-white; }
    .thumb { @apply h-24 w-24 cursor-zoom-in rounded-lg object-cover ring-1 ring-black/5 transition hover:opacity-90; }

    /* Back to top */
    .back-to-top { @apply fixed bottom-6 right-6 z-40 grid h-11 w-11 translate-y-4 place-items-center rounded-full bg-brand-700 text-white opacity-0 shadow-lg transition hover:bg-brand-800 pointer-events-none; }
    .back-to-top.show { @apply pointer-events-auto translate-y-0 opacity-100; }

    /* Kéo thả sắp xếp + Kanban */
    .sortable-item { @apply cursor-grab active:cursor-grabbing; }
    .is-dragging { @apply opacity-40; }
    .drag-handle { @apply cursor-grab px-1 text-slate-300 hover:text-slate-500; }
    .kanban { @apply flex gap-4 overflow-x-auto pb-2; }
    .kanban-col { @apply flex w-72 shrink-0 flex-col rounded-xl bg-slate-100 dark:bg-slate-900; }
    .kanban-head { @apply flex items-center gap-2 px-3 py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-200; }
    .kanban-count { @apply ml-auto rounded-full bg-white px-2 text-xs font-medium text-slate-500 dark:bg-slate-800; }
    .kanban-list { @apply flex min-h-[80px] flex-1 flex-col gap-2 px-2 pb-2; }
    .kanban-list.is-over { @apply rounded-lg bg-brand-50/70 outline-dashed outline-2 outline-brand-300 dark:bg-brand-900/20; }
    .kanban-card { @apply cursor-grab rounded-lg border border-slate-200 bg-white p-3 text-sm shadow-sm transition hover:shadow-md active:cursor-grabbing dark:border-slate-700 dark:bg-slate-800; }
    .kanban-card-title { @apply font-medium text-slate-900 dark:text-white; }

    /* Cây (Tree view) */
    .tree { @apply text-sm; }
    .tree ul { @apply ml-4 border-l border-slate-200 pl-2 dark:border-slate-800; }
    .tree-node { @apply flex cursor-pointer items-center gap-1.5 rounded-md px-1.5 py-1 text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800; }
    .tree-node.selected { @apply bg-brand-50 font-medium text-brand-800 dark:bg-brand-900/40 dark:text-brand-100; }
    .tree-caret { @apply grid h-4 w-4 shrink-0 place-items-center text-[10px] text-slate-400 transition-transform; }
    .tree-item.open > .tree-node .tree-caret { @apply rotate-90; }
    .tree-item:not(.open) > ul { @apply hidden; }
    .tree-node mark { @apply rounded bg-accent-200 px-0.5 text-inherit; }

    /* Lịch tháng */
    .calendar { @apply overflow-hidden rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900; }
    .calendar-head { @apply flex items-center gap-2 border-b border-slate-200 px-4 py-3 dark:border-slate-800; }
    .calendar-title { @apply text-base font-semibold capitalize text-slate-900 dark:text-white; }
    .calendar-grid { @apply grid grid-cols-7; }
    .calendar-dow { @apply border-b border-slate-200 bg-slate-50 py-2 text-center text-xs font-semibold uppercase text-slate-500 dark:border-slate-800 dark:bg-slate-800/60; }
    .calendar-day { @apply min-h-[96px] cursor-pointer border-b border-r border-slate-100 p-1.5 transition-colors hover:bg-slate-50 dark:border-slate-800 dark:hover:bg-slate-800/50; }
    .calendar-day:nth-child(7n) { @apply border-r-0; }
    .calendar-day.other { @apply bg-slate-50/60 text-slate-400 dark:bg-slate-950/40; }
    .calendar-day.weekend .calendar-num { @apply text-red-500; }
    .calendar-num { @apply mb-1 grid h-6 w-6 place-items-center rounded-full text-xs font-medium; }
    .calendar-day.today .calendar-num { @apply bg-brand-700 text-white; }
    .calendar-event { @apply mb-0.5 block truncate rounded px-1.5 py-0.5 text-[11px] font-medium; }
    .calendar-event.brand   { @apply bg-brand-100 text-brand-800 dark:bg-brand-900/60 dark:text-brand-100; }
    .calendar-event.success { @apply bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200; }
    .calendar-event.warning { @apply bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200; }
    .calendar-event.danger  { @apply bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-200; }
    .calendar-event.info    { @apply bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200; }
    .calendar-more { @apply px-1.5 text-[11px] text-slate-400; }

    /* Command palette (Ctrl+K) */
    .cmdk-input { @apply h-14 w-full border-0 border-b border-slate-200 bg-transparent px-5 text-base text-slate-900 outline-none placeholder:text-slate-400 dark:border-slate-800 dark:text-white; }
    .cmdk-list { @apply max-h-80 overflow-y-auto p-2; }
    .cmdk-group { @apply px-3 pb-1 pt-2 text-[11px] font-semibold uppercase tracking-wide text-slate-400; }
    .cmdk-item { @apply flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-slate-700 dark:text-slate-200; }
    .cmdk-item > i { @apply w-5 text-center text-slate-400; }
    .cmdk-item.active { @apply bg-brand-50 text-brand-800 dark:bg-brand-900/50 dark:text-white; }
    .cmdk-item.active > i { @apply text-brand-600 dark:text-accent-400; }

    /* Context menu */
    .context-menu { @apply fixed z-[160] block min-w-[11rem]; }

    /* Máy quét mã */
    .scanner-view { @apply overflow-hidden rounded-xl bg-slate-900; }
    .scanner-view video { @apply w-full; }

    /* Đồng hồ / đếm ngược */
    .countdown { @apply inline-flex gap-2 font-mono tabular-nums; }
    .countdown > span { @apply flex min-w-[3rem] flex-col items-center rounded-lg bg-brand-900 px-2 py-1.5 text-lg font-bold text-white; }
    .countdown > span > small { @apply font-sans text-[10px] font-medium uppercase text-white/60; }

    /* Sparkline */
    .sparkline { @apply block h-10 w-full; }

    /* Thumbnail trong dropzone */
    .file-thumb { @apply h-10 w-10 shrink-0 rounded-md object-cover; }

    /* =====================================================================
     * MỞ RỘNG (v1.2)
     * ===================================================================== */

    /* Datepicker */
    .datepicker { @apply absolute left-0 top-full z-50 mt-1.5 w-72 animate-dropdown-in rounded-xl bg-white p-3 shadow-lg ring-1 ring-black/5 dark:bg-slate-800 dark:ring-white/10; }
    .datepicker-head { @apply mb-2 flex items-center justify-between gap-1; }
    .datepicker-title { @apply text-sm font-semibold capitalize text-slate-900 dark:text-white; }
    .datepicker-grid { @apply grid grid-cols-7 gap-0.5 text-center; }
    .datepicker-dow { @apply py-1 text-[11px] font-semibold text-slate-400; }
    .datepicker-day { @apply grid h-8 cursor-pointer place-items-center rounded-md text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700; }
    .datepicker-day.other { @apply text-slate-300 dark:text-slate-600; }
    .datepicker-day.today { @apply font-bold text-brand-700 dark:text-accent-400; }
    .datepicker-day.in-range { @apply rounded-none bg-brand-50 dark:bg-brand-900/40; }
    .datepicker-day.selected { @apply bg-brand-700 font-semibold text-white hover:bg-brand-700; }
    .datepicker-day.disabled { @apply pointer-events-none opacity-30; }
    .datepicker-presets { @apply mt-2 flex flex-wrap gap-1 border-t border-slate-100 pt-2 dark:border-slate-700; }

    /* Combobox chọn nhiều */
    .combo-multi .combo-toggle { @apply h-auto min-h-[36px] flex-wrap justify-start py-1 pl-1.5; }
    .combo-multi .combo-toggle .chip { @apply h-6; }
    .combo-check { @apply grid h-4 w-4 shrink-0 place-items-center rounded border border-slate-300 text-[9px] text-white dark:border-slate-600; }
    .combo-option.selected .combo-check { @apply border-brand-700 bg-brand-700; }

    /* Autocomplete */
    .autocomplete-panel { @apply absolute left-0 right-0 top-full z-50 mt-1 max-h-72 overflow-y-auto rounded-xl bg-white p-1 shadow-lg ring-1 ring-black/5 dark:bg-slate-800 dark:ring-white/10; }

    /* Bàn phím số (tablet / màn hình cảm ứng) */
    .numpad { @apply grid select-none grid-cols-3 gap-2; }
    .numpad > button { @apply h-14 rounded-xl bg-white text-xl font-semibold text-slate-800 shadow-sm ring-1 ring-slate-200 transition active:scale-95 active:bg-slate-100 dark:bg-slate-800 dark:text-white dark:ring-slate-700; }
    .numpad > button.numpad-ok { @apply bg-brand-700 text-white ring-brand-700 active:bg-brand-800; }
    .numpad > button.numpad-fn { @apply bg-slate-100 text-base text-slate-600 dark:bg-slate-700 dark:text-slate-200; }
    .numpad-display { @apply mb-3 rounded-xl bg-slate-900 px-4 py-3 text-right font-mono text-3xl font-bold tabular-nums text-accent-300; }

    /* Soạn thảo văn bản */
    .editor { @apply overflow-hidden rounded-lg border border-slate-300 bg-white shadow-sm focus-within:border-brand-600 focus-within:ring-2 focus-within:ring-brand-600/20 dark:border-slate-700 dark:bg-slate-900; }
    .editor-toolbar { @apply flex flex-wrap gap-0.5 border-b border-slate-200 bg-slate-50 p-1 dark:border-slate-700 dark:bg-slate-800; }
    .editor-toolbar > button { @apply grid h-8 w-8 place-items-center rounded-md text-sm text-slate-600 hover:bg-slate-200 dark:text-slate-300 dark:hover:bg-slate-700; }
    .editor-toolbar > button.active { @apply bg-brand-100 text-brand-800 dark:bg-brand-900 dark:text-brand-100; }
    .editor-toolbar > .sep { @apply mx-1 w-px self-stretch bg-slate-200 dark:bg-slate-700; }
    .editor-content { @apply min-h-[140px] px-3 py-2 text-sm leading-relaxed text-slate-800 outline-none dark:text-slate-200; }
    .editor-content ul { @apply list-disc pl-5; }
    .editor-content ol { @apply list-decimal pl-5; }
    .editor-content a { @apply text-brand-700 underline; }
    .editor-content:empty::before { content: attr(data-placeholder); @apply text-slate-400; }

    /* Transfer list */
    .transfer { @apply grid items-stretch gap-3 md:grid-cols-[1fr_auto_1fr]; }
    .transfer-box { @apply flex h-72 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-900; }
    .transfer-head { @apply flex items-center justify-between border-b border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300; }
    .transfer-list { @apply flex-1 overflow-y-auto p-1; }
    .transfer-item { @apply flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-sm hover:bg-slate-50 dark:hover:bg-slate-800; }
    .transfer-actions { @apply flex flex-row justify-center gap-2 md:flex-col; }

    /* Bảng nhập liệu (Editable grid) */
    .grid-edit td { @apply p-0; }
    .grid-edit td > .cell { @apply block h-10 w-full min-w-[80px] border-0 bg-transparent px-3 text-sm text-slate-800 outline-none focus:bg-brand-50 focus:ring-2 focus:ring-inset focus:ring-brand-600 dark:text-slate-100 dark:focus:bg-brand-900/30; }
    .grid-edit td > .cell.is-invalid { @apply bg-red-50 ring-2 ring-inset ring-red-500 dark:bg-red-950/40; }
    .grid-edit td.readonly { @apply bg-slate-50 px-3 text-slate-500 dark:bg-slate-800/50; }
    .grid-edit tr.is-new td { @apply bg-accent-50/40 dark:bg-accent-900/10; }
    .grid-edit tr.is-dirty td:first-child { box-shadow: inset 3px 0 0 #fbbf24; }

    /* Gantt */
    .gantt { @apply overflow-x-auto rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900; }
    .gantt-row { @apply flex border-b border-slate-100 last:border-0 dark:border-slate-800; }
    .gantt-label { @apply sticky left-0 z-10 flex w-48 shrink-0 items-center gap-2 border-r border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-800 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200; }
    .gantt-track { @apply relative flex-1; }
    .gantt-days { @apply flex; }
    .gantt-day { @apply shrink-0 border-r border-slate-100 py-1.5 text-center text-[10px] text-slate-400 dark:border-slate-800; }
    .gantt-day.weekend { @apply bg-slate-50 dark:bg-slate-800/40; }
    .gantt-day.today { @apply bg-accent-100 font-bold text-accent-800 dark:bg-accent-900/40 dark:text-accent-300; }
    .gantt-bar { @apply absolute top-1/2 flex h-6 -translate-y-1/2 cursor-pointer items-center overflow-hidden whitespace-nowrap rounded-md px-2 text-[11px] font-semibold text-white shadow-sm transition hover:brightness-110; }
    .gantt-bar > .gantt-progress { @apply absolute inset-y-0 left-0 bg-black/20; }
    .gantt-bar > span { @apply relative; }

    /* Gauge */
    .gauge { @apply relative inline-flex flex-col items-center; }
    .gauge-value { @apply absolute inset-x-0 bottom-0 text-center font-bold leading-none tabular-nums text-slate-900 dark:text-white; }
    .gauge-label { @apply mt-1 text-xs font-medium uppercase tracking-wide text-slate-500; }

    /* Pivot */
    .pivot td.num, .pivot th.num { @apply text-right tabular-nums; }
    .pivot tr.total td, .pivot td.total { @apply bg-slate-50 font-semibold dark:bg-slate-800/60; }

    /* Wizard */
    .wizard-step { @apply hidden; }
    .wizard-step.active { @apply block animate-fade-in; }

    /* Tour hướng dẫn */
    .tour-spot { @apply pointer-events-none fixed z-[260] rounded-lg ring-4 ring-accent-400 transition-all duration-300; box-shadow: 0 0 0 9999px rgba(2, 6, 23, .55); }
    .tour-pop { @apply fixed z-[261] w-80 max-w-[calc(100vw-2rem)] animate-fade-in rounded-xl bg-white p-4 shadow-2xl dark:bg-slate-800; }
    .tour-title { @apply mb-1 font-semibold text-slate-900 dark:text-white; }
    .tour-text { @apply text-sm text-slate-600 dark:text-slate-300; }

    /* Toast có nút thao tác */
    .toast-actions { @apply flex shrink-0 items-center gap-1; }
    .toast-action { @apply rounded-md px-2.5 py-1 text-[13px] font-semibold text-accent-300 hover:bg-white/10; }

    /* Bottom navigation (điện thoại) */
    .bottom-nav { @apply fixed inset-x-0 bottom-0 z-30 grid border-t border-slate-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur dark:border-slate-800 dark:bg-slate-900/95; grid-auto-flow: column; grid-auto-columns: 1fr; }
    .bottom-nav-item { @apply relative flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium text-slate-500 dark:text-slate-400; }
    .bottom-nav-item > i { @apply text-lg; }
    .bottom-nav-item.active { @apply text-brand-700 dark:text-accent-400; }
    .bottom-nav-item .badge-count { @apply absolute right-[calc(50%-20px)] top-1 grid h-4 min-w-[16px] place-items-center rounded-full bg-red-500 px-1 text-[10px] text-white; }
    .has-bottom-nav { @apply pb-20; }

    /* Bình luận / trao đổi */
    .comment-list { @apply space-y-4; }
    .comment { @apply flex gap-3; }
    .comment-body { @apply min-w-0 flex-1 rounded-xl rounded-tl-sm bg-slate-100 px-3.5 py-2.5 dark:bg-slate-800; }
    .comment-meta { @apply mb-0.5 flex items-center gap-2 text-xs; }
    .comment-author { @apply font-semibold text-slate-900 dark:text-white; }
    .comment.mine { @apply flex-row-reverse; }
    .comment.mine .comment-body { @apply rounded-tl-xl rounded-tr-sm bg-brand-700 text-white; }
    .comment.mine .comment-author, .comment.mine .comment-meta { @apply text-white/80; }

    /* =====================================================================
     * MỞ RỘNG (v1.3) – component giao diện phổ biến
     * ===================================================================== */

    /* Toggle button: <input type="checkbox|radio" class="btn-check" id="a"><label class="btn btn-secondary" for="a">A</label> */
    .btn-check { @apply pointer-events-none absolute h-0 w-0 opacity-0; }
    .btn-check:checked + .btn { @apply border-brand-700 bg-brand-700 text-white hover:bg-brand-800 dark:border-brand-500 dark:bg-brand-600; }
    .btn-check:checked + .btn-outline { @apply bg-brand-700 text-white; }
    .btn-check:focus-visible + .btn { @apply ring-2 ring-brand-500 ring-offset-2; }
    .btn-check:disabled + .btn { @apply pointer-events-none opacity-50; }

    /* Indicator: chấm / số đếm ở góc phần tử */
    .indicator { @apply relative inline-flex; }
    .indicator-item { @apply absolute -right-1 -top-1 z-10 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-red-500 px-1 text-[10px] font-bold leading-none text-white ring-2 ring-white dark:ring-slate-900; }
    .indicator-item.dot-only { @apply h-2.5 min-w-0 w-2.5 p-0; }
    .indicator-item.bottom { @apply -bottom-1 top-auto; }
    .indicator-item.left { @apply -left-1 right-auto; }

    /* Steps dọc */
    .steps-vertical { @apply flex flex-col; }
    .steps-vertical .step-v { @apply relative flex gap-3 pb-6 last:pb-0; }
    .steps-vertical .step-v:not(:last-child)::before { content: ''; @apply absolute bottom-0 left-4 top-9 w-0.5 -translate-x-1/2 bg-slate-200 dark:bg-slate-700; }
    .steps-vertical .step-v.done:not(:last-child)::before { @apply bg-brand-700; }
    .steps-vertical .step-v.done .step-index { @apply border-brand-700 bg-brand-700 text-white; }
    .steps-vertical .step-v.active .step-index { @apply border-brand-700 text-brand-700 ring-4 ring-brand-100 dark:ring-brand-900; }
    .step-v-title { @apply pt-1 text-sm font-semibold text-slate-900 dark:text-white; }
    .step-v-text { @apply text-xs text-slate-500; }

    /* Dropdown menu con */
    .dropdown-sub { @apply relative; }
    .dropdown-sub > .dropdown-item::after { content: '\f105'; font-family: 'Font Awesome 6 Free'; font-weight: 900; @apply ml-auto text-[10px] text-slate-400; }
    .dropdown-sub > .dropdown-menu { @apply left-full right-auto top-0 -mt-1 ml-1; }
    .dropdown-sub:hover > .dropdown-menu, .dropdown-sub:focus-within > .dropdown-menu { @apply block; }

    /* Menu sidebar có nhóm con */
    .nav-group > .nav-link .nav-caret { @apply ml-auto text-[10px] transition-transform; }
    .nav-group.open > .nav-link .nav-caret { @apply rotate-90; }
    .nav-group > .nav-sub { @apply ml-5 hidden space-y-0.5 border-l border-white/10 py-1 pl-3; }
    .nav-group.open > .nav-sub { @apply block; }
    .nav-sub > .nav-link { @apply py-1.5 text-[13px]; }
    .app.sidebar-collapsed .nav-group .nav-sub, .app.sidebar-collapsed .nav-caret { @apply lg:hidden; }

    /* Chữ chạy (ticker) */
    .ticker { @apply relative flex items-center overflow-hidden rounded-lg bg-brand-900 text-sm text-white; }
    .ticker-label { @apply z-10 flex shrink-0 items-center gap-2 bg-accent-400 px-3 py-2 font-semibold text-brand-950; }
    .ticker-track { @apply flex shrink-0 gap-12 whitespace-nowrap py-2 pl-6; animation: tv-ticker var(--ticker-speed, 30s) linear infinite; }
    .ticker:hover .ticker-track { animation-play-state: paused; }

    /* Trang kết quả / lỗi (404, 403, thành công…) */
    .result { @apply mx-auto flex max-w-lg flex-col items-center px-4 py-16 text-center; }
    .result-icon { @apply mb-6 grid h-24 w-24 place-items-center rounded-full text-4xl; }
    .result-code { @apply text-6xl font-extrabold tracking-tight text-brand-900 dark:text-white; }
    .result-title { @apply mt-2 text-xl font-semibold text-slate-900 dark:text-white; }
    .result-text { @apply mt-2 text-sm text-slate-500; }

    /* Khối code có nút copy */
    .code-block { @apply relative overflow-hidden rounded-xl bg-slate-900 text-xs leading-relaxed text-slate-100; }
    .code-block > pre { @apply overflow-auto p-4; }
    .code-block-head { @apply flex items-center justify-between border-b border-white/10 px-4 py-2 text-[11px] font-medium uppercase tracking-wide text-slate-400; }
    .code-copy { @apply absolute right-2 top-2 rounded-md bg-white/10 px-2 py-1 text-[11px] text-slate-200 opacity-0 transition hover:bg-white/20; }
    .code-block:hover .code-copy, .code-copy:focus { @apply opacity-100; }

    /* Card mở rộng */
    .card-media { @apply overflow-hidden; }
    .card-media > img, .card-media > .card-cover { @apply aspect-[16/9] w-full object-cover; }
    .card-horizontal { @apply flex overflow-hidden; }
    .card-horizontal > img, .card-horizontal > .card-cover { @apply w-40 shrink-0 object-cover; }
    .profile-card { @apply overflow-hidden text-center; }
    .profile-cover { @apply h-20 bg-brand-800; }
    .profile-card .avatar { @apply -mt-10 ring-4 ring-white dark:ring-slate-900; }

    /* Thanh lọc + chip bộ lọc đang áp dụng */
    .filter-bar { @apply flex flex-wrap items-center gap-2 rounded-xl border border-slate-200 bg-white p-2 dark:border-slate-800 dark:bg-slate-900; }

    /* Carousel */
    .carousel { @apply relative overflow-hidden rounded-xl; }
    .carousel-track { @apply flex transition-transform duration-500 ease-out; touch-action: pan-y; }
    .carousel-track > * { @apply w-full shrink-0; }
    .carousel-btn { @apply absolute top-1/2 grid h-10 w-10 -translate-y-1/2 place-items-center rounded-full bg-white/80 text-slate-700 shadow hover:bg-white; }
    .carousel-dots { @apply absolute bottom-3 left-1/2 flex -translate-x-1/2 gap-1.5; }
    .carousel-dots > button { @apply h-2 w-2 rounded-full bg-white/60 transition-all; }
    .carousel-dots > button.active { @apply w-6 bg-white; }

    /* Range 2 đầu */
    .range-dual { @apply relative h-6; }
    .range-dual > .range-rail { @apply absolute inset-x-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-slate-200 dark:bg-slate-700; }
    .range-dual > .range-fill { @apply absolute top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-brand-700; }
    .range-dual > input[type=range] { @apply pointer-events-none absolute inset-0 h-6 w-full appearance-none bg-transparent; }
    .range-dual > input[type=range]::-webkit-slider-thumb { @apply pointer-events-auto h-5 w-5 cursor-pointer appearance-none rounded-full border-2 border-brand-700 bg-white shadow; }
    .range-dual > input[type=range]::-moz-range-thumb { @apply pointer-events-auto h-4 w-4 cursor-pointer rounded-full border-2 border-brand-700 bg-white shadow; }
    .range-values { @apply mt-1 flex justify-between text-xs font-medium text-slate-600 dark:text-slate-300; }

    /* Đếm ký tự, độ mạnh mật khẩu */
    .char-counter { @apply mt-1 text-right text-[11px] tabular-nums text-slate-400; }
    .char-counter.over { @apply font-semibold text-red-500; }
    .strength { @apply mt-1.5 grid grid-cols-4 gap-1; }
    .strength > span { @apply h-1 rounded-full bg-slate-200 transition-colors dark:bg-slate-700; }
    .strength-text { @apply mt-1 text-[11px] font-medium; }

    /* Tooltip JS (tự lật hướng, không bị cắt) */
    .tv-tip { @apply pointer-events-none fixed z-[300] max-w-xs animate-fade-in rounded-md bg-slate-900 px-2 py-1 text-xs font-medium text-white shadow-lg dark:bg-slate-700; }

    /* Popconfirm */
    .popconfirm { @apply fixed z-[160] w-72 animate-dropdown-in rounded-xl bg-white p-4 shadow-xl ring-1 ring-black/5 dark:bg-slate-800 dark:ring-white/10; }

    /* Splitter */
    .split { @apply flex min-h-0 overflow-hidden; }
    .split.vertical { @apply flex-col; }
    .split > .split-pane { @apply min-h-0 min-w-0 overflow-auto; }
    .split > .split-gutter { @apply relative shrink-0 cursor-col-resize bg-slate-200 transition-colors hover:bg-brand-400 dark:bg-slate-800; width: 6px; }
    .split.vertical > .split-gutter { @apply cursor-row-resize; width: auto; height: 6px; }
    .split.is-resizing { @apply select-none; }

    /* Avatar upload */
    .avatar-upload { @apply relative inline-block cursor-pointer; }
    .avatar-upload .avatar { @apply h-24 w-24 text-2xl; }
    .avatar-upload-btn { @apply absolute bottom-0 right-0 grid h-8 w-8 place-items-center rounded-full bg-brand-700 text-xs text-white ring-4 ring-white dark:ring-slate-900; }

    /* Trung tâm thông báo */
    .notif-panel { @apply w-[22rem] max-w-[calc(100vw-2rem)] p-0; }
    .notif-head { @apply flex items-center justify-between border-b border-slate-100 px-4 py-3 dark:border-slate-700; }
    .notif-list { @apply max-h-96 overflow-y-auto; }
    .notif-item { @apply flex cursor-pointer gap-3 border-b border-slate-50 px-4 py-3 last:border-0 hover:bg-slate-50 dark:border-slate-700/50 dark:hover:bg-slate-700/40; }
    .notif-item.unread { @apply bg-brand-50/50 dark:bg-brand-900/20; }
    .notif-item.unread .notif-title::after { content: ''; @apply ml-2 inline-block h-2 w-2 rounded-full bg-brand-600 align-middle; }
    .notif-title { @apply text-sm font-medium text-slate-900 dark:text-white; }
    .notif-time { @apply mt-0.5 text-[11px] text-slate-400; }

    /* Topbar đổ bóng khi cuộn */
    .app-topbar.scrolled { @apply shadow-sm; }

    /* Màu chọn nhanh */
    .swatches { @apply flex flex-wrap gap-2; }
    .swatch-opt { @apply relative h-8 w-8 cursor-pointer rounded-full ring-1 ring-black/10 transition hover:scale-110; }
    .swatch-opt.selected { @apply ring-2 ring-slate-900 ring-offset-2 dark:ring-white dark:ring-offset-slate-900; }

    /* =====================================================================
     * MỞ RỘNG (v1.4)
     * ===================================================================== */

    /* Tabs dọc */
    .tabs-vertical { @apply flex-col gap-0.5 overflow-visible border-b-0 border-r border-slate-200 pr-2 dark:border-slate-800; }
    .tabs-vertical .tab { @apply mb-0 mr-[-9px] justify-start rounded-l-md border-b-0 border-r-2 py-2; }
    .tabs-vertical .tab.active { @apply border-brand-700 bg-brand-50/60 dark:border-accent-400 dark:bg-brand-900/30; }

    /* Bảng tự chuyển thành thẻ trên điện thoại: <table class="table table-stack"> */
    @media (max-width: 640px) {
      .table-stack thead { @apply hidden; }
      .table-stack tbody tr { @apply mb-3 block rounded-xl border border-slate-200 p-1 dark:border-slate-800; }
      .table-stack tbody td { @apply flex items-center justify-between gap-3 border-b border-slate-100 px-3 py-2 text-right dark:border-slate-800; }
      .table-stack tbody td::before { content: attr(data-label); @apply text-left text-xs font-semibold uppercase text-slate-400; }
      .table-stack tbody td:last-child { @apply border-b-0; }
      .table-wrapper:has(.table-stack) { @apply border-0 bg-transparent; }
    }

    /* Modal dạng sheet trượt từ dưới lên trên điện thoại */
    @media (max-width: 640px) {
      .modal.modal-sheet { @apply items-end p-0; }
      .modal.modal-sheet .modal-dialog { @apply my-0 max-h-[90vh] max-w-full rounded-b-none; animation: tv-sheet-in .25s ease-out; }
      .modal.modal-sheet .modal-dialog::before { content: ''; @apply mx-auto mt-2 block h-1.5 w-10 shrink-0 rounded-full bg-slate-300 dark:bg-slate-700; }
    }

    /* Thanh thao tác hàng loạt (hiện khi chọn dòng) */
    .action-bar { @apply fixed bottom-6 left-1/2 z-40 flex -translate-x-1/2 items-center gap-2 rounded-2xl bg-slate-900 py-2 pl-4 pr-2 text-sm text-white shadow-2xl transition-all duration-200 dark:bg-slate-700; }
    .action-bar.hidden-bar { @apply pointer-events-none translate-y-24 opacity-0; }
    .action-bar .btn-ghost { @apply text-white/80 hover:bg-white/10 hover:text-white; }

    /* Thanh tiến trình mảnh đầu trang (tự chạy khi gọi server) */
    .tv-progress-top { @apply pointer-events-none fixed left-0 top-0 z-[400] h-0.5 bg-accent-500 transition-[width,opacity] duration-300; }

    /* Watermark (bảo mật báo cáo) */
    .tv-watermark { @apply pointer-events-none fixed inset-0 z-[90] select-none; }

    /* Timeline ngang / lộ trình */
    .timeline-h { @apply flex overflow-x-auto pb-2; }
    .timeline-h-item { @apply relative min-w-[150px] flex-1 px-2 pt-8 text-center; }
    .timeline-h-item::before { content: ''; @apply absolute left-0 right-0 top-3 h-0.5 bg-slate-200 dark:bg-slate-700; }
