<!--
  TXTV_Scripts.html – Thư viện JavaScript của TXTV (không phụ thuộc thư viện ngoài).
  Đặt cuối <body>:  include('TXTV_Scripts')  (xem README)
  Namespace toàn cục: window.TXTV  (alias: window.TV)
-->
<script>
(function (global) {
  'use strict';

  var TXTV = { version: '1.2.0' };

  /* =====================================================================
   * TIỆN ÍCH CHUNG
   * ===================================================================== */
  var $  = function (sel, root) { return typeof sel === 'string' ? (root || document).querySelector(sel) : sel; };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  TXTV.$ = $; TXTV.$$ = $$;

  /** Escape HTML để chống XSS khi render dữ liệu người dùng */
  TXTV.escape = function (str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var esc = TXTV.escape;

  /** Tạo element từ chuỗi HTML */
  TXTV.html = function (htmlString) {
    var t = document.createElement('template');
    t.innerHTML = htmlString.trim();
    return t.content.firstElementChild;
  };

  TXTV.debounce = function (fn, wait) {
    var t; return function () { var ctx = this, args = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(ctx, args); }, wait || 250); };
  };
  TXTV.throttle = function (fn, wait) {
    var last = 0; return function () { var now = Date.now(); if (now - last >= (wait || 250)) { last = now; fn.apply(this, arguments); } };
  };
  TXTV.uid = function (prefix) { return (prefix || 'tv') + '-' + Math.random().toString(36).slice(2, 9); };

  /** Bỏ dấu tiếng Việt (dùng cho tìm kiếm không dấu) */
  TXTV.removeAccents = function (str) {
    return String(str || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
  };
  TXTV.matchText = function (haystack, needle) {
    return TXTV.removeAccents(haystack).toLowerCase().indexOf(TXTV.removeAccents(needle).toLowerCase().trim()) !== -1;
  };

  TXTV.copy = function (text) {
    var done = function () { TXTV.toast('Đã sao chép vào clipboard', { type: 'success', duration: 1800 }); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
    }
    fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { TXTV.toast('Không thể sao chép', { type: 'error' }); }
      ta.remove();
    }
  };

  /* =====================================================================
   * ĐỊNH DẠNG (chuẩn Việt Nam)
   * ===================================================================== */
  TXTV.format = {
    number: function (n, decimals) {
      if (n === '' || n === null || n === undefined || isNaN(n)) return '';
      return Number(n).toLocaleString('vi-VN', { minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals === undefined ? 2 : decimals });
    },
    currency: function (n, currency) {
      if (n === '' || n === null || n === undefined || isNaN(n)) return '';
      return Number(n).toLocaleString('vi-VN', { style: 'currency', currency: currency || 'VND', maximumFractionDigits: currency && currency !== 'VND' ? 2 : 0 });
    },
    percent: function (n, decimals) {
      if (n === '' || n === null || isNaN(n)) return '';
      return Number(n).toLocaleString('vi-VN', { style: 'percent', maximumFractionDigits: decimals === undefined ? 1 : decimals });
    },
    /** date(value, 'dd/MM/yyyy HH:mm:ss') */
    date: function (value, pattern) {
      if (!value) return '';
      var d = value instanceof Date ? value : new Date(value);
      if (isNaN(d)) return String(value);
      var p = function (n) { return String(n).padStart(2, '0'); };
      var map = { yyyy: d.getFullYear(), MM: p(d.getMonth() + 1), dd: p(d.getDate()), HH: p(d.getHours()), mm: p(d.getMinutes()), ss: p(d.getSeconds()) };
      return (pattern || 'dd/MM/yyyy').replace(/yyyy|MM|dd|HH|mm|ss/g, function (k) { return map[k]; });
    },
    datetime: function (value) { return TXTV.format.date(value, 'dd/MM/yyyy HH:mm'); },
    /** Chuyển chuỗi dd/MM/yyyy -> Date */
    parseDate: function (str) {
      var m = String(str || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (!m) return null;
      return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
    },
    /** Giá trị cho input[type=date] (yyyy-MM-dd) */
    isoDate: function (value) { return TXTV.format.date(value || new Date(), 'yyyy-MM-dd'); },
    relative: function (value) {
      var d = value instanceof Date ? value : new Date(value);
      var s = Math.round((Date.now() - d.getTime()) / 1000);
      if (s < 60) return 'vừa xong';
      if (s < 3600) return Math.floor(s / 60) + ' phút trước';
      if (s < 86400) return Math.floor(s / 3600) + ' giờ trước';
      if (s < 2592000) return Math.floor(s / 86400) + ' ngày trước';
      return TXTV.format.date(d);
    },
    fileSize: function (bytes) {
      if (!bytes) return '0 B';
      var u = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i];
    },
    initials: function (name) {
      var parts = String(name || '').trim().split(/\s+/);
      if (!parts[0]) return '?';
      return (parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : parts[0].slice(0, 2)).toUpperCase();
    }
  };

  /* =====================================================================
   * GỌI SERVER: TXTV.run('tenHam', thamSo1, thamSo2...) -> Promise
   *   - Tự dùng google.script.run khi chạy trong Apps Script
   *   - Khi chạy ngoài Apps Script (xem trước), dùng TXTV.mocks[tenHam]
   * ===================================================================== */
  TXTV.mocks = {};
  TXTV.isAppsScript = function () { return !!(global.google && google.script && google.script.run); };

  TXTV.run = function (fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (TXTV.isAppsScript()) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
          reject(err instanceof Error ? err : new Error(err && err.message ? err.message : String(err)));
        });
        if (typeof runner[fnName] !== 'function') return reject(new Error('Không tìm thấy hàm server: ' + fnName));
        runner[fnName].apply(runner, args);
      } else if (typeof TXTV.mocks[fnName] === 'function') {
        setTimeout(function () {
          // Sao chép JSON giống google.script.run thật (tham số/kết quả được tuần tự hóa, không dùng chung tham chiếu)
          var clone = function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); };
          try { resolve(clone(TXTV.mocks[fnName].apply(null, args.map(clone)))); } catch (e) { reject(e); }
        }, 400 + Math.random() * 400);
      } else {
        reject(new Error('Không chạy trong Apps Script và không có mock cho: ' + fnName));
      }
    });
  };

  /**
   * TXTV.call – gọi server kèm loading + toast lỗi tự động.
   *   TXTV.call('saveData', [obj], { loading: 'Đang lưu...', success: 'Đã lưu!', button: btnEl })
   */
  TXTV.call = function (fnName, args, opts) {
    opts = opts || {};
    if (opts.button) TXTV.btnLoading(opts.button, true, opts.buttonText);
    else if (opts.loading !== false) TXTV.loading.show(opts.loading || 'Đang xử lý...');
    return TXTV.run.apply(null, [fnName].concat(args || []))
      .then(function (res) {
        if (opts.success) TXTV.toast(typeof opts.success === 'function' ? opts.success(res) : opts.success, { type: 'success' });
        return res;
      })
      .catch(function (err) {
        if (opts.error !== false) TXTV.toast(err.message || String(err), { type: 'error', title: 'Có lỗi xảy ra', duration: 6000 });
        throw err;
      })
      .finally(function () {
        if (opts.button) TXTV.btnLoading(opts.button, false);
        else if (opts.loading !== false) TXTV.loading.hide();
      });
  };

  /* =====================================================================
   * TOAST
   *   TXTV.toast('Nội dung', { type: 'success|error|warning|info', title, duration, position: 'top|bottom' })
   * ===================================================================== */
  var TOAST_ICON = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
  TXTV.toast = function (message, opts) {
    if (typeof opts === 'string') opts = { type: opts };
    opts = opts || {};
    var type = opts.type || 'info';
    var pos = opts.position === 'bottom' ? 'bottom' : 'top';
    var container = $('.toast-container.' + pos) || (function () {
      var c = document.createElement('div'); c.className = 'toast-container ' + pos;
      c.setAttribute('aria-live', 'polite'); document.body.appendChild(c); return c;
    })();
    var el = TXTV.html(
      '<div class="toast toast-' + type + '" role="status">' +
        '<i class="toast-icon fa-solid ' + (opts.icon || TOAST_ICON[type] || TOAST_ICON.info) + '"></i>' +
        '<div class="min-w-0 flex-1">' +
          (opts.title ? '<div class="toast-title">' + esc(opts.title) + '</div>' : '') +
          '<div class="toast-text">' + (opts.html ? message : esc(message)) + '</div>' +
          (opts.actions ? '<div class="toast-actions"></div>' : '') +
        '</div>' +
        '<button type="button" class="toast-close" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>');
    var close = function () {
      if (el._closing) return; el._closing = true;
      el.classList.add('is-leaving'); setTimeout(function () { el.remove(); }, 300);
    };
    el.querySelector('.toast-close').addEventListener('click', close);
    (opts.actions || []).forEach(function (a, i) {
      var b = document.createElement('button'); b.type = 'button';
      b.className = 'btn btn-xs ' + (a.primary || i === 0 ? 'btn-primary' : 'btn-secondary'); b.textContent = a.label;
      b.addEventListener('click', function () { close(); if (a.onClick) a.onClick(); });
      el.querySelector('.toast-actions').appendChild(b);
    });
    container.appendChild(el);
    var duration = opts.duration === undefined ? 3500 : opts.duration;
    if (duration > 0) {
      var timer = setTimeout(close, duration);
      el.addEventListener('mouseenter', function () { clearTimeout(timer); });
      el.addEventListener('mouseleave', function () { timer = setTimeout(close, 1500); });
    }
    return { el: el, close: close };
  };
  ['success', 'error', 'warning', 'info'].forEach(function (t) {
    TXTV.toast[t] = function (msg, title, opts) { return TXTV.toast(msg, Object.assign({ type: t, title: title }, opts || {})); };
  });

  /* =====================================================================
   * KHÓA CUỘN BODY
   * ===================================================================== */
  var lockCount = 0;
  function lockBody()   { lockCount++; document.body.classList.add('tv-lock'); }
  function unlockBody() { lockCount = Math.max(0, lockCount - 1); if (!lockCount) document.body.classList.remove('tv-lock'); }

  /* =====================================================================
   * MODAL
   *   HTML: <div class="modal" id="myModal"> <div class="modal-backdrop"></div> <div class="modal-dialog">...</div> </div>
   *   Mở:   data-tv-toggle="modal" data-tv-target="#myModal"   hoặc TXTV.modal.open('#myModal')
   *   Đóng: data-tv-dismiss="modal"                            hoặc TXTV.modal.close('#myModal')
   *   Thuộc tính: data-static="true" (không đóng khi click nền / Esc)
   *   Sự kiện: 'tv:open', 'tv:close' trên phần tử modal
   * ===================================================================== */
  var openStack = [];
  function makeOverlay(kind) {
    return {
      open: function (target) {
        var el = $(target); if (!el || el.classList.contains('open')) return el;
        el.classList.add('open'); el.setAttribute('aria-hidden', 'false');
        openStack.push(el); lockBody();
        el._lastFocus = document.activeElement;
        var focusEl = el.querySelector('[autofocus], input:not([type=hidden]):not([disabled]), select, textarea, .btn-primary');
        setTimeout(function () { if (focusEl) focusEl.focus(); }, 60);
        el.dispatchEvent(new CustomEvent('tv:open', { bubbles: true }));
        return el;
      },
      close: function (target) {
        var el = target ? $(target) : openStack[openStack.length - 1]; if (!el || !el.classList.contains('open')) return el;
        el.classList.remove('open'); el.setAttribute('aria-hidden', 'true');
        openStack = openStack.filter(function (x) { return x !== el; }); unlockBody();
        if (el._lastFocus && el._lastFocus.focus) { try { el._lastFocus.focus(); } catch (e) {} }
        el.dispatchEvent(new CustomEvent('tv:close', { bubbles: true }));
        return el;
      },
      toggle: function (target) { var el = $(target); return el && el.classList.contains('open') ? this.close(el) : this.open(el); }
    };
  }
  TXTV.modal = makeOverlay('modal');
  TXTV.drawer = makeOverlay('drawer');

  /** Tạo modal động: TXTV.modal.create({ title, body (HTML), size: 'sm|lg|xl|full', footer (HTML), static }) */
  TXTV.modal.create = function (o) {
    o = o || {};
    var el = TXTV.html(
      '<div class="modal ' + (o.size ? 'modal-' + o.size : '') + '" role="dialog" aria-modal="true"' + (o.static ? ' data-static="true"' : '') + '>' +
        '<div class="modal-backdrop"></div>' +
        '<div class="modal-dialog">' +
          (o.title !== undefined ? '<div class="modal-header"><h3 class="modal-title">' + esc(o.title) + '</h3>' +
            '<button type="button" class="modal-close" data-tv-dismiss="modal" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button></div>' : '') +
          '<div class="modal-body">' + (o.body || '') + '</div>' +
          (o.footer ? '<div class="modal-footer">' + o.footer + '</div>' : '') +
        '</div>' +
      '</div>');
    document.body.appendChild(el);
    if (o.destroyOnClose !== false) el.addEventListener('tv:close', function () { setTimeout(function () { el.remove(); }, 200); });
    TXTV.modal.open(el);
    return el;
  };

  /* =====================================================================
   * DIALOG: alert / confirm / prompt (trả về Promise)
   *   await TXTV.alert('Đã lưu', { type: 'success' })
   *   if (await TXTV.confirm({ title: 'Xóa?', text: '...', type: 'danger', confirmText: 'Xóa' })) {...}
   *   var v = await TXTV.prompt({ title: 'Nhập lý do', required: true })
   * ===================================================================== */
  var DIALOG_ICON = { info: 'fa-circle-info', success: 'fa-check', warning: 'fa-triangle-exclamation', danger: 'fa-trash-can', error: 'fa-xmark', question: 'fa-question' };
  function dialog(o) {
    return new Promise(function (resolve) {
      var type = o.type === 'error' ? 'danger' : (o.type || 'question');
      var btnClass = { danger: 'btn-danger', warning: 'btn-warning', success: 'btn-success', info: 'btn-info' }[type] || 'btn-primary';
      var inputHtml = '';
      if (o.mode === 'prompt') {
        inputHtml = '<div class="mt-4 text-left">' +
          (o.label ? '<label class="form-label mb-1.5' + (o.required ? ' required' : '') + '">' + esc(o.label) + '</label>' : '') +
          (o.multiline
            ? '<textarea class="form-control" data-dialog-input rows="3" placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>'
            : '<input class="form-control" data-dialog-input type="' + (o.inputType || 'text') + '" placeholder="' + esc(o.placeholder || '') + '" value="' + esc(o.value || '') + '">') +
          '<p class="form-error mt-1.5 hidden" data-dialog-error><i class="fa-solid fa-circle-exclamation"></i> Vui lòng nhập thông tin</p></div>';
      }
      var el = TXTV.html(
        '<div class="modal modal-sm" role="alertdialog" aria-modal="true"' + (o.static ? ' data-static="true"' : '') + '>' +
          '<div class="modal-backdrop"></div>' +
          '<div class="modal-dialog">' +
            '<div class="modal-body pt-7 text-center">' +
              (o.icon === false ? '' : '<div class="dialog-icon ' + type + '"><i class="fa-solid ' + (o.icon || DIALOG_ICON[o.type] || DIALOG_ICON[type]) + '"></i></div>') +
              (o.title ? '<h3 class="text-lg font-semibold text-slate-900 dark:text-white">' + esc(o.title) + '</h3>' : '') +
              (o.text ? '<div class="mt-2 text-sm text-slate-500 dark:text-slate-400">' + (o.html ? o.text : esc(o.text)) + '</div>' : '') +
              inputHtml +
            '</div>' +
            '<div class="flex gap-2 px-6 pb-6">' +
              (o.mode !== 'alert' ? '<button type="button" class="btn btn-secondary flex-1" data-dialog="cancel">' + esc(o.cancelText || 'Hủy') + '</button>' : '') +
              '<button type="button" class="btn ' + btnClass + ' flex-1" data-dialog="ok">' + esc(o.confirmText || (o.mode === 'alert' ? 'Đóng' : 'Xác nhận')) + '</button>' +
            '</div>' +
          '</div>' +
        '</div>');
      document.body.appendChild(el);
      var input = el.querySelector('[data-dialog-input]');
      var result;
      var finish = function (val) { result = val; TXTV.modal.close(el); };
      el.addEventListener('tv:close', function () {
        setTimeout(function () { el.remove(); }, 200);
        if (result === undefined) result = o.mode === 'prompt' ? null : (o.mode === 'alert' ? true : false);
        resolve(result);
      });
      el.querySelector('[data-dialog="ok"]').addEventListener('click', function () {
        if (o.mode === 'prompt') {
          var v = input.value.trim();
          if (o.required && !v) { input.classList.add('is-invalid'); el.querySelector('[data-dialog-error]').classList.remove('hidden'); input.focus(); return; }
          return finish(v);
        }
        finish(true);
      });
      var cancel = el.querySelector('[data-dialog="cancel"]');
      if (cancel) cancel.addEventListener('click', function () { finish(o.mode === 'prompt' ? null : false); });
      if (input) input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !o.multiline) el.querySelector('[data-dialog="ok"]').click(); });
      TXTV.modal.open(el);
      if (!input) setTimeout(function () { el.querySelector('[data-dialog="ok"]').focus(); }, 60);
    });
  }
  function normalize(a, b) { return typeof a === 'string' ? Object.assign({ text: a }, b || {}) : (a || {}); }
  TXTV.alert   = function (a, b) { var o = normalize(a, b); o.mode = 'alert'; o.type = o.type || 'info'; return dialog(o); };
  TXTV.confirm = function (a, b) { var o = normalize(a, b); o.mode = 'confirm'; if (!o.title && !b) { o.title = o.text; o.text = ''; } return dialog(o); };
  TXTV.prompt  = function (a, b) { var o = normalize(a, b); o.mode = 'prompt'; o.icon = o.icon || false; if (!o.title) { o.title = o.text; o.text = ''; } return dialog(o); };

  /* =====================================================================
   * LOADING
   *   TXTV.loading.show('Đang tải...'); TXTV.loading.hide();
   *   TXTV.loading.block(el, true/false)  – che 1 vùng
   *   TXTV.btnLoading(btn, true/false, 'Đang lưu...')
   * ===================================================================== */
  var loadingCount = 0, loadingEl = null;
  TXTV.loading = {
    show: function (text) {
      loadingCount++;
      if (!loadingEl) {
        loadingEl = TXTV.html('<div class="loading-overlay"><div class="loading-box"><span class="spinner spinner-xl"></span><div class="loading-text"></div></div></div>');
        document.body.appendChild(loadingEl);
      }
      loadingEl.querySelector('.loading-text').textContent = text || 'Đang tải...';
    },
    hide: function (force) {
      loadingCount = force ? 0 : Math.max(0, loadingCount - 1);
      if (!loadingCount && loadingEl) { loadingEl.remove(); loadingEl = null; }
    },
    block: function (target, on) {
      var el = $(target); if (!el) return;
      el.classList.add('loading-block');
      var mask = el.querySelector(':scope > .loading-mask');
      if (on === false) { if (mask) mask.remove(); return; }
      if (!mask) el.appendChild(TXTV.html('<div class="loading-mask"><span class="spinner spinner-lg text-brand-700"></span></div>'));
    }
  };
  TXTV.btnLoading = function (btn, on, text) {
    btn = $(btn); if (!btn) return;
    if (on === false) {
      if (btn._origHtml !== undefined) { btn.innerHTML = btn._origHtml; delete btn._origHtml; }
      btn.disabled = false; btn.removeAttribute('aria-busy');
      return;
    }
    if (btn._origHtml === undefined) btn._origHtml = btn.innerHTML;
    btn.style.minWidth = btn.offsetWidth + 'px';
    btn.innerHTML = '<span class="spinner spinner-sm"></span>' + (text !== undefined ? esc(text) : (btn.classList.contains('btn-icon') ? '' : esc(btn.textContent.trim())));
    btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  };

  /* =====================================================================
   * DROPDOWN
   *   <div class="dropdown"> <button data-tv-toggle="dropdown">...</button> <div class="dropdown-menu">...</div> </div>
   * ===================================================================== */
  /** Panel nổi (dropdown/combobox) nằm trong vùng overflow sẽ được định vị fixed để không bị cắt */
  var CLIP_SEL = '.table-wrapper, .modal-body, .drawer-body, .overflow-hidden, .overflow-auto, .overflow-x-auto, .overflow-y-auto, [data-tv-float]';
  function floatPanel(anchor, panel, alignLeft) {
    resetPanel(panel);
    if (!anchor.parentElement.closest(CLIP_SEL)) return;
    var r = anchor.getBoundingClientRect();
    panel.style.position = 'fixed'; panel.style.margin = '0'; panel.style.right = 'auto'; panel.style.bottom = 'auto';
    var w = panel.offsetWidth, h = panel.offsetHeight;
    var left = alignLeft ? r.left : r.right - w;
    left = Math.max(8, Math.min(left, global.innerWidth - w - 8));
    var top = r.bottom + 6;
    if (top + h > global.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
    panel.style.left = left + 'px'; panel.style.top = top + 'px'; panel.style.zIndex = '150';
    panel._floating = true;
  }
  function resetPanel(panel) {
    if (!panel || !panel._floating) return;
    ['position', 'margin', 'right', 'bottom', 'left', 'top', 'zIndex', 'width'].forEach(function (k) { panel.style[k] = ''; });
    panel._floating = false;
  }
  TXTV.dropdown = {
    closeAll: function (except) {
      $$('.dropdown.open').forEach(function (d) {
        if (d !== except && !d.contains(except)) { d.classList.remove('open'); resetPanel(d.querySelector(':scope > .dropdown-menu')); }
      });
    },
    toggle: function (el) {
      var dd = $(el).closest('.dropdown'); var willOpen = !dd.classList.contains('open');
      TXTV.dropdown.closeAll(dd); dd.classList.toggle('open', willOpen);
      var menu = dd.querySelector(':scope > .dropdown-menu');
      if (willOpen && menu) floatPanel(dd, menu, menu.classList.contains('dropdown-left'));
      else resetPanel(menu);
    }
  };
  // Đóng panel nổi khi cuộn (tránh lệch vị trí) hoặc khi đổi kích thước cửa sổ

  /* =====================================================================
   * FORM: serialize / fill / validate / reset
   *   var data = TXTV.form.serialize('#frm')   -> { field: value }

   *     - data-type="number" -> Number; data-type="date" -> chuỗi yyyy-MM-dd

  TXTV.form = {
    serialize: function (form) {

        var name = el.name; if (!name || el.disabled || el.type === 'file' || el.type === 'button' || el.type === 'submit') return;
        if (el._serialize) { data[name] = el._serialize(); return; }   // component tùy biến (datepicker, transfer...)
        var multiCheck = el.type === 'checkbox' && form.querySelectorAll('input[type=checkbox][name="' + name + '"]').length > 1;
        var val;
        if (el.type === 'checkbox') {
          if (multiCheck) { data[name] = data[name] || []; if (el.checked) data[name].push(el.value); return; }
          val = el.checked;
        } else if (el.type === 'radio') {
          if (!el.checked) { if (!(name in data)) data[name] = ''; return; } val = el.value;
        } else if (el.tagName === 'SELECT' && el.multiple) {

        } else {
          val = el.value;
          if ((el.dataset.type === 'number' || el.type === 'number' || el.type === 'range') && val !== '') val = Number(String(val).replace(/,/g, '.'));
          if (el.dataset.type === 'json' && val) { try { val = JSON.parse(val); } catch (e) {} }

    fill: function (form, obj) {

          else if (el.tagName === 'SELECT' && el.multiple) $$('option', el).forEach(function (o) { o.selected = (v || []).indexOf(o.value) !== -1; });
          else if (el.type === 'date' && v) el.value = TXTV.format.isoDate(v);

      $$('[data-tv-rating]', form).forEach(function (r) { if (r.setValue) r.setValue(0); });
      $$('[data-tv-otp] input', form).forEach(function (i) { i.value = ''; });
      $$('input, select, textarea', form).forEach(function (el) { if (el._onReset) el._onReset(); });

      $$('[data-tv-tags]', form).forEach(function (el) { if (el._tags) el._tags.set([]); });

    },
    /** Kiểm tra hợp lệ dùng HTML5 (required, min, max, pattern, type=email...) + data-match="#idKhac" */
    validate: function (form, opts) {

          else if (v.typeMismatch) msg = el.type === 'email' ? 'Email không hợp lệ' : 'Giá trị không hợp lệ';
          else if (v.patternMismatch) msg = el.title || 'Sai định dạng';
          else if (v.rangeUnderflow) msg = 'Giá trị tối thiểu là ' + el.min;
          else if (v.rangeOverflow) msg = 'Giá trị tối đa là ' + el.max;
          else if (v.tooShort) msg = 'Tối thiểu ' + el.minLength + ' ký tự';
          else if (v.tooLong) msg = 'Tối đa ' + el.maxLength + ' ký tự';

          var group = el.closest('.form-group') || el.parentElement;
          if (!group.querySelector('.form-error[data-auto]')) {
            var err = TXTV.html('<p class="form-error" data-auto><i class="fa-solid fa-circle-exclamation"></i><span></span></p>');
            err.querySelector('span').textContent = msg; group.appendChild(err);

        if (opts.toast !== false) TXTV.toast('Vui lòng kiểm tra lại các trường được đánh dấu', { type: 'warning' });
      }
      return !firstInvalid;
    }
  };

  /** Đọc file thành base64 để gửi lên server (Drive): { name, mimeType, size, data } */

  /* =====================================================================
   * DROPZONE:  <div class="dropzone" data-tv-dropzone data-accept="image/*,.pdf" data-max-size="10" data-multiple>

    if (dz.hasAttribute('data-multiple')) input.multiple = true;
    dz.appendChild(input);
    var list = dz.dataset.list ? $(dz.dataset.list) : null;
    var maxMB = +dz.dataset.maxSize || 0;
    var render = function () {
      if (!list) return;
      list.innerHTML = dz._files.map(function (f, i) {
        if (/^image\//.test(f.type) && !f._url) f._url = URL.createObjectURL(f);
        return '<div class="file-item">' + (f._url ? '<img class="file-thumb" src="' + f._url + '" alt="">' : '<i class="fa-solid ' + fileIcon(f) + ' text-lg text-brand-600"></i>') +
          '<div class="min-w-0 flex-1"><div class="truncate font-medium text-slate-800 dark:text-slate-200">' + esc(f.name) + '</div><div class="text-xs text-slate-400">' + TXTV.format.fileSize(f.size) + '</div></div>' +
          '<button type="button" class="btn btn-ghost btn-icon btn-xs" data-remove="' + i + '"><i class="fa-solid fa-xmark"></i></button></div>';
      }).join('');
    };
    var add = function (files) {
      Array.prototype.forEach.call(files, function (f) {
        if (maxMB && f.size > maxMB * 1048576) { TXTV.toast('"' + f.name + '" vượt quá ' + maxMB + ' MB', { type: 'warning' }); return; }
        if (input.multiple) dz._files.push(f); else dz._files = [f];
      });
      render(); dz.dispatchEvent(new CustomEvent('tv:files', { detail: { files: dz._files }, bubbles: true }));
    };

    input.addEventListener('change', function () { add(input.files); input.value = ''; });
    ['dragenter', 'dragover'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('is-dragover'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('is-dragover'); }); });
    dz.addEventListener('drop', function (e) { add(e.dataTransfer.files); });

  /* =====================================================================

      list.innerHTML = items.length ? items.map(function (o, i) {
        return '<div class="combo-option' + (o.selected ? ' selected' : '') + (i === hi ? ' highlight' : '') + '" data-value="' + esc(o.value) + '" role="option">' +
          '<span class="truncate">' + esc(o.textContent) + '</span>' + (o.selected ? '<i class="fa-solid fa-check text-xs"></i>' : '') + '</div>';
      }).join('') : '<div class="combo-empty">Không tìm thấy kết quả</div>';

        items.forEach(function (it, i) { it.classList.toggle('highlight', i === hi); }); if (items[hi]) items[hi].scrollIntoView({ block: 'nearest' });

          return head + '<div class="cmdk-item' + (i === active ? ' active' : '') + '" data-i="' + i + '"><i class="fa-solid ' + (it.icon || 'fa-arrow-right') + '"></i><span class="flex-1">' + esc(it.label) + '</span>' + (it.hint ? '<span class="text-xs text-slate-400">' + esc(it.hint) + '</span>' : '') + '</div>';
        }).join('') : '<div class="combo-empty">Không tìm thấy chức năng phù hợp</div>';
      };
      var run = function (i) { var it = shown[i]; if (!it) return; TXTV.modal.close(el); setTimeout(function () { it.action && it.action(it); }, 50); };
      input.addEventListener('input', function () { active = 0; render(); });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % Math.max(1, shown.length); render(); var a = list.querySelector('.active'); if (a) a.scrollIntoView({ block: 'nearest' }); }

  /* =====================================================================
   * CONTEXT MENU (chuột phải)
   *   TXTV.contextMenu('#vung', function (e, target) { return [{ label, icon, action, danger }, { divider: true }]; }, '.selector-con');
   * ===================================================================== */
  var ctxEl = null;

  TXTV.contextMenu = function (area, items, delegateSel) {

  /* =====================================================================
   * ĐỒNG HỒ & ĐẾM NGƯỢC
   *   <span data-tv-clock data-format="HH:mm:ss"></span>
   *   <div class="countdown" data-tv-countdown="2026-12-31T17:00:00"></div>   (sự kiện 'tv:done' khi hết giờ)
   * ===================================================================== */
  function tickTimers() {
    $$('[data-tv-clock]').forEach(function (el) { el.textContent = TXTV.format.date(new Date(), el.dataset.format || 'HH:mm:ss'); });
    $$('[data-tv-countdown]').forEach(function (el) {
      var diff = Math.max(0, new Date(el.getAttribute('data-tv-countdown')) - Date.now()), s = Math.floor(diff / 1000);
      var parts = [[Math.floor(s / 86400), 'ngày'], [Math.floor(s % 86400 / 3600), 'giờ'], [Math.floor(s % 3600 / 60), 'phút'], [s % 60, 'giây']];
      var html = parts.map(function (p) { return '<span>' + String(p[0]).padStart(2, '0') + '<small>' + p[1] + '</small></span>'; }).join('');
      if (el._last !== html) { el.innerHTML = html; el._last = html; }

  /* =====================================================================
   * SPARKLINE (SVG nhẹ, không cần Chart.js)
   *   TXTV.sparkline('#el', [5, 8, 6, 12, 9], { color: '#0b5a41', fill: true })

    var color = o.color || el.dataset.color || '#0b5a41', id = TXTV.uid('sg');
    el.innerHTML = '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="' + id + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".25"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      (o.fill !== false ? '<path d="' + line + ' L' + w + ' ' + h + ' L0 ' + h + ' Z" fill="url(#' + id + ')"/>' : '') +

  /* =====================================================================
   * EXCEL – xuất / nhập .xlsx (tự tải SheetJS khi cần)
   *   TXTV.exportExcel(rows, [{ key, label, format }], 'bao-cao', 'Sheet1')
   *   TXTV.readExcel(file).then(rows => ...)      // dòng 1 = tiêu đề
   * ===================================================================== */
  var libs = {};
  TXTV.loadLib = function (name, src, globalName) {
    if (global[globalName]) return Promise.resolve(global[globalName]);
    libs[name] = libs[name] || TXTV.loadScript(src).then(function () { return global[globalName]; });
    return libs[name];
  };
  var XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  TXTV.exportExcel = function (rows, columns, filename, sheetName) {
    return TXTV.loadLib('xlsx', XLSX_SRC, 'XLSX').then(function (XLSX) {
      columns = columns || Object.keys((rows || [])[0] || {}).map(function (k) { return { key: k, label: k }; });
      var aoa = [columns.map(function (c) { return c.label || c.key; })].concat((rows || []).map(function (r) {
        return columns.map(function (c) {
          var v = c.exportValue ? c.exportValue(r) : r[c.key];
          if ((c.format === 'date' || c.format === 'datetime') && v) { var d = new Date(v); return isNaN(d) ? v : d; }
          return v === undefined || v === null ? '' : v;
        });
      }));
      var ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true, dateNF: 'dd/mm/yyyy' });
      ws['!cols'] = columns.map(function (c, i) { return { wch: Math.min(50, Math.max(10, String(aoa[0][i]).length + 2, ...aoa.slice(1, 200).map(function (r) { return String(r[i] instanceof Date ? '00/00/0000' : r[i]).length + 2; }))) }; });
      var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, (sheetName || 'Sheet1').slice(0, 31));
      XLSX.writeFile(wb, (filename || 'du-lieu') + '.xlsx');
    }).catch(function (e) { TXTV.toast('Không tải được thư viện Excel: ' + e.message, { type: 'error' }); throw e; });
  };
  TXTV.readExcel = function (file, opts) {
    opts = opts || {};
    return TXTV.loadLib('xlsx', XLSX_SRC, 'XLSX').then(function (XLSX) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          try {
            var wb = XLSX.read(new Uint8Array(r.result), { type: 'array', cellDates: true });
            var ws = wb.Sheets[opts.sheet || wb.SheetNames[0]];
            resolve(XLSX.utils.sheet_to_json(ws, { defval: '', raw: opts.raw !== false }));
          } catch (e) { reject(e); }
        };
        r.onerror = reject; r.readAsArrayBuffer(file);
      });
    });
  };

  /* =====================================================================

  /* =====================================================================
   * QUÉT MÃ (QR / mã vạch) bằng camera hoặc súng bắn mã
   *   TXTV.scan({ title: 'Quét mã bó hàng' }).then(code => ...)   // null nếu hủy
   *   - Súng bắn mã USB/Bluetooth (giả lập bàn phím): bắn thẳng vào ô nhập.
   *   - Camera: cần trình duyệt cho phép (mở Web App trực tiếp, không nhúng trong Google Sites).
   * ===================================================================== */
  TXTV.scan = function (o) {
    o = o || {};
    return new Promise(function (resolve) {
      var id = TXTV.uid('scan'), result = null, scanner = null;
      var el = TXTV.modal.create({
        title: o.title || 'Quét mã', size: 'sm',
        body: '<div class="space-y-3"><div class="scanner-view hidden" id="' + id + '"></div>' +
          '<div class="input-icon"><i class="fa-solid fa-barcode"></i><input class="form-control" data-scan-input placeholder="Bắn mã hoặc nhập tay rồi Enter"></div>' +
          '<button type="button" class="btn btn-secondary btn-block" data-scan-cam><i class="fa-solid fa-camera"></i> Dùng camera</button></div>'
      });
      var input = el.querySelector('[data-scan-input]');
      var done = function (code) { if (!code) return; result = String(code).trim(); TXTV.modal.close(el); };
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); done(input.value); } });
      setTimeout(function () { input.focus(); }, 80);
      el.querySelector('[data-scan-cam]').addEventListener('click', function () {
        var btn = this; TXTV.btnLoading(btn, true, 'Đang mở camera...');
        TXTV.loadLib('html5qrcode', 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js', 'Html5Qrcode').then(function (H) {
          $('#' + id).classList.remove('hidden'); btn.classList.add('hidden');
          scanner = new H(id);

        }).catch(function (e) {
          TXTV.btnLoading(btn, false);
          TXTV.toast('Không mở được camera: ' + (e && e.message ? e.message : e), { type: 'error' });
        });
      });
      el.addEventListener('tv:close', function () {
        if (scanner) { try { scanner.stop().catch(function () {}); } catch (e) {} }
        if (result && o.beep !== false) beep();
        resolve(result);
      });
    });
  };
  function beep() {
    try { var a = new (global.AudioContext || global.webkitAudioContext)(), osc = a.createOscillator(); osc.frequency.value = 1200; osc.connect(a.destination); osc.start(); osc.stop(a.currentTime + 0.08); } catch (e) {}
  }

  /* =====================================================================

  };

  /* =====================================================================
   * FORM: tự lưu nháp & cảnh báo khi rời trang chưa lưu
   *   TXTV.form.autosave('#frm', 'nhap-phieu-xuat');   ->  .clear() sau khi lưu thành công

    var save = TXTV.debounce(function () { TXTV.storage.set(key, TXTV.form.serialize(form)); }, 500);

  /* Back to top */

  /** Khởi tạo các thành phần mở rộng (được gọi trong TXTV.init) */

  /** Chuyển nhiều kiểu giá trị thành Date (giờ địa phương): Date | 'yyyy-MM-dd' | 'dd/MM/yyyy' | timestamp */
  TXTV.toDate = function (v) {
    if (!v && v !== 0) return null;
    if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
    var s = String(v), m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)) return TXTV.format.parseDate(s);
    var d = new Date(v); return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
  };
  var sameDay = function (a, b) { return a && b && a.getTime() === b.getTime(); };
  var DOW = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];

  /** Lọc HTML do người dùng nhập (từ editor) – bỏ script, sự kiện on*, link javascript: */
  TXTV.sanitize = function (html) {
    var t = document.createElement('template'); t.innerHTML = String(html || '');
    $$('script, style, iframe, object, embed, link, meta', t.content).forEach(function (n) { n.remove(); });
    $$('*', t.content).forEach(function (n) {
      Array.prototype.slice.call(n.attributes).forEach(function (a) {
        var name = a.name.toLowerCase(), val = a.value.trim().toLowerCase();
        if (name.indexOf('on') === 0 || ((name === 'href' || name === 'src') && /^(javascript|data):/.test(val) && !/^data:image\//.test(val))) n.removeAttribute(a.name);
      });
    });
    return t.innerHTML;
  };

  /* =====================================================================
   * DATEPICKER – hiển thị dd/MM/yyyy, chọn 1 ngày hoặc khoảng ngày
   *   <input class="form-control" name="ngay" data-tv-datepicker>
   *   <input class="form-control" name="kyBaoCao" data-tv-datepicker data-mode="range" data-min="2026-01-01">
   *   serialize(): 'yyyy-MM-dd'  |  range: { from: 'yyyy-MM-dd', to: 'yyyy-MM-dd' }
   *   el._dp.get() / el._dp.set(value | {from,to}) / el._dp.open()
   * ===================================================================== */
  function initDatepicker(input) {
    if (input._dp) return input._dp;
    var range = input.dataset.mode === 'range';
    var min = TXTV.toDate(input.dataset.min), max = TXTV.toDate(input.dataset.max);
    var start = null, end = null, view = new Date();
    input.setAttribute('autocomplete', 'off');
    if (!input.placeholder) input.placeholder = range ? 'dd/mm/yyyy – dd/mm/yyyy' : 'dd/mm/yyyy';
    var wrap = document.createElement('div'); wrap.className = 'input-icon input-icon-right relative';
    input.parentNode.insertBefore(wrap, input); wrap.appendChild(input);
    wrap.insertAdjacentHTML('beforeend', '<i class="fa-regular fa-calendar"></i>');
    var panel = document.createElement('div'); panel.className = 'datepicker hidden'; wrap.appendChild(panel);
    var fmt = function (d) { return d ? TXTV.format.date(d) : ''; };
    var show = function () { input.value = range ? (start ? fmt(start) + ' – ' + fmt(end || start) : '') : fmt(start); };
    var commit = function () { show(); input.classList.remove('is-invalid'); input.dispatchEvent(new Event('change', { bubbles: true })); };
    var parseText = function () {
      var parts = input.value.split(/\s*[–-]\s*(?=\d{1,2}\/)/);
      start = TXTV.toDate(parts[0]); end = range ? (TXTV.toDate(parts[1]) || start) : null;
      if (range && start && end && end < start) { var t = start; start = end; end = t; }
    };
    var render = function () {
      var y = view.getFullYear(), m = view.getMonth(), first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, today = TXTV.toDate(new Date());
      var html = '<div class="datepicker-head"><button type="button" class="btn btn-ghost btn-icon btn-xs" data-dp="-12" aria-label="Năm trước"><i class="fa-solid fa-angles-left"></i></button>' +
        '<button type="button" class="btn btn-ghost btn-icon btn-xs" data-dp="-1" aria-label="Tháng trước"><i class="fa-solid fa-chevron-left"></i></button>' +
        '<div class="datepicker-title">' + esc(first.toLocaleDateString('vi-VN', { month: 'long', year: 'numeric' })) + '</div>' +
        '<button type="button" class="btn btn-ghost btn-icon btn-xs" data-dp="1" aria-label="Tháng sau"><i class="fa-solid fa-chevron-right"></i></button>' +
        '<button type="button" class="btn btn-ghost btn-icon btn-xs" data-dp="12" aria-label="Năm sau"><i class="fa-solid fa-angles-right"></i></button></div>' +
        '<div class="datepicker-grid">' + DOW.map(function (d) { return '<div class="datepicker-dow">' + d + '</div>'; }).join('');
      for (var i = 0; i < 42; i++) {
        var d = new Date(y, m, 1 - off + i), cls = 'datepicker-day';
        if (d.getMonth() !== m) cls += ' other';
        if (sameDay(d, today)) cls += ' today';
        if ((min && d < min) || (max && d > max)) cls += ' disabled';
        if (sameDay(d, start) || sameDay(d, end)) cls += ' selected';
        else if (range && start && end && d > start && d < end) cls += ' in-range';
        html += '<div class="' + cls + '" data-day="' + TXTV.format.isoDate(d) + '">' + d.getDate() + '</div>';
      }

      rowKeys: rowKeys, colKeys: colKeys,
      get: function (r, k) { return reduce(cells[r + '\u0001' + k]); },
      rowTotal: function (r) { return reduce(collect(function (p) { return String(p[0]) === String(r); })); },
      colTotal: function (k) { return reduce(collect(function (p) { return String(p[1]) === String(k); })); },
      grandTotal: function () { return reduce(collect(function () { return true; })); }
    };
  };
  TXTV.renderPivot = function (el, data, c) {
    el = $(el); var p = TXTV.pivot(data, c), f = c.format && TXTV.format[c.format] ? TXTV.format[c.format] : TXTV.format.number;
    var cf = c.colFormat || function (x) { return x; }, rf = c.rowFormat || function (x) { return x; };
    var max = 0; p.rowKeys.forEach(function (r) { p.colKeys.forEach(function (k) { max = Math.max(max, p.get(r, k) || 0); }); });
    var heat = function (v) { return c.heatmap && v ? ' style="background:rgba(11,90,65,' + (0.08 + 0.5 * v / (max || 1)).toFixed(2) + ')"' : ''; };
    el.innerHTML = '<div class="table-wrapper"><table class="table table-compact table-bordered pivot"><thead><tr><th>' + esc(c.rowLabel || '') + '</th>' +
      p.colKeys.map(function (k) { return '<th class="num">' + esc(cf(k)) + '</th>'; }).join('') + '<th class="num">Tổng</th></tr></thead><tbody>' +
      p.rowKeys.map(function (r) {
        return '<tr><td class="font-medium">' + esc(rf(r)) + '</td>' + p.colKeys.map(function (k) { var v = p.get(r, k); return '<td class="num"' + heat(v) + '>' + (v === null ? '<span class="text-slate-300">–</span>' : esc(f(v))) + '</td>'; }).join('') +
          '<td class="num total">' + esc(f(p.rowTotal(r))) + '</td></tr>';
      }).join('') + '<tr class="total"><td>Tổng</td>' + p.colKeys.map(function (k) { return '<td class="num">' + esc(f(p.colTotal(k))) + '</td>'; }).join('') + '<td class="num">' + esc(f(p.grandTotal())) + '</td></tr></tbody></table></div>';
    return p;
  };

  /* =====================================================================
   * WIZARD – biểu mẫu nhiều bước, kiểm tra từng bước
   *   <form data-tv-wizard> <div class="steps">...</div>
   *     <div class="wizard-step">...</div> <div class="wizard-step">...</div>
   *     <button type="button" data-wizard="prev">  <button type="button" data-wizard="next">  <button type="submit" data-wizard="finish">
   *   </form>
   *   Sự kiện 'tv:step' (detail.index). el._wizard.go(i) / .next() / .prev()
   * ===================================================================== */
  TXTV.wizard = function (el) {
    el = $(el); if (el._wizard) return el._wizard;
    var steps = $$('.wizard-step', el), ind = el.querySelector('.steps'), cur = 0;
    var show = function (i) {
      cur = Math.max(0, Math.min(steps.length - 1, i));
      steps.forEach(function (s, k) { s.classList.toggle('active', k === cur); });
      if (ind) TXTV.steps.set(ind, cur);
      $$('[data-wizard="prev"]', el).forEach(function (b) { b.classList.toggle('invisible', cur === 0); });
      $$('[data-wizard="next"]', el).forEach(function (b) { b.classList.toggle('hidden', cur === steps.length - 1); });
      $$('[data-wizard="finish"]', el).forEach(function (b) { b.classList.toggle('hidden', cur !== steps.length - 1); });
      el.dispatchEvent(new CustomEvent('tv:step', { detail: { index: cur }, bubbles: true }));
    };
    var api = {
      next: function () { if (el.hasAttribute('data-no-validate') || TXTV.form.validate(steps[cur], { toast: false })) show(cur + 1); },
      prev: function () { show(cur - 1); }, go: show, current: function () { return cur; },
      validateAll: function () { for (var i = 0; i < steps.length; i++) { if (!TXTV.form.validate(steps[i], { toast: false })) { show(i); TXTV.form.validate(steps[i]); return false; } } return true; }
    };
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-wizard]'); if (!b || b.closest('[data-tv-wizard]') !== el) return;
      if (b.dataset.wizard === 'next') { e.preventDefault(); api.next(); }
      if (b.dataset.wizard === 'prev') { e.preventDefault(); api.prev(); }
    });
    el._wizard = api; show(0);
    return api;
  };

  /* =====================================================================
   * TOUR – hướng dẫn sử dụng từng bước (đào tạo người dùng mới)
   *   TXTV.tour([{ el: '#btnThem', title: 'Thêm mới', text: 'Bấm để tạo phiếu' }, ...], { key: 'tour-kho-v1' })
   *   key: chỉ chạy 1 lần / trình duyệt (bỏ key hoặc force: true để luôn chạy)
   * ===================================================================== */
  TXTV.tour = function (steps, o) {
    o = o || {};
    if (o.key && !o.force && TXTV.storage.get('txtv-tour:' + o.key)) return Promise.resolve(false);
    return new Promise(function (resolve) {
      var i = 0, spot = TXTV.html('<div class="tour-spot"></div>'), pop = TXTV.html('<div class="tour-pop" role="dialog"></div>');
      document.body.appendChild(spot); document.body.appendChild(pop);
      var end = function (done) {
        spot.remove(); pop.remove(); global.removeEventListener('resize', place); document.removeEventListener('keydown', onKey);
        if (o.key) TXTV.storage.set('txtv-tour:' + o.key, 1);
        resolve(done);
      };
      var place = function () {
        var s = steps[i], target = s.el ? $(s.el) : null, pad = 6;
        if (target) {
          var r = target.getBoundingClientRect();
          spot.style.cssText = 'left:' + (r.left - pad) + 'px;top:' + (r.top - pad) + 'px;width:' + (r.width + pad * 2) + 'px;height:' + (r.height + pad * 2) + 'px';
          var pw = pop.offsetWidth, ph = pop.offsetHeight, top = r.bottom + 14;
          if (top + ph > global.innerHeight - 8) top = Math.max(8, r.top - ph - 14);
          pop.style.left = Math.max(8, Math.min(r.left, global.innerWidth - pw - 8)) + 'px'; pop.style.top = top + 'px';
        } else {
          spot.style.cssText = 'left:50%;top:50%;width:0;height:0';
          pop.style.left = (global.innerWidth - pop.offsetWidth) / 2 + 'px'; pop.style.top = (global.innerHeight - pop.offsetHeight) / 2 + 'px';
        }
      };
      var draw = function () {
        var s = steps[i], target = s.el ? $(s.el) : null;
        pop.innerHTML = '<div class="mb-2 flex items-center justify-between"><span class="badge badge-brand badge-pill">' + (i + 1) + ' / ' + steps.length + '</span><button type="button" class="btn btn-ghost btn-icon btn-xs" data-tour="end" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button></div>' +
          '<div class="tour-title">' + esc(s.title || '') + '</div><div class="tour-text">' + (s.html ? s.text : esc(s.text || '')) + '</div>' +
          '<div class="mt-4 flex items-center gap-2"><button type="button" class="btn btn-ghost btn-sm" data-tour="end">Bỏ qua</button><div class="ml-auto flex gap-2">' +
          (i > 0 ? '<button type="button" class="btn btn-secondary btn-sm" data-tour="prev">Trước</button>' : '') +
          '<button type="button" class="btn btn-primary btn-sm" data-tour="next">' + (i === steps.length - 1 ? 'Hoàn tất' : 'Tiếp') + '</button></div></div>';
        if (target) { target.scrollIntoView({ block: 'center', behavior: 'smooth' }); setTimeout(place, 350); }
        place();
      };
      var onKey = function (e) { if (e.key === 'Escape') end(false); if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); };
      var go = function (d) { if (i + d >= steps.length) return end(true); i = Math.max(0, i + d); draw(); };
      pop.addEventListener('click', function (e) { var b = e.target.closest('[data-tour]'); if (!b) return; if (b.dataset.tour === 'end') end(false); else go(b.dataset.tour === 'next' ? 1 : -1); });
      global.addEventListener('resize', place); document.addEventListener('keydown', onKey);
      draw();
    });
  };

  /* =====================================================================
   * NÉN ẢNH trước khi gửi lên server (giảm dung lượng, tránh giới hạn của Apps Script)
   *   var img = await TXTV.compressImage(file, { maxWidth: 1600, quality: 0.8 });  // { name, mimeType, size, data, dataUrl }
   *   Chụp ảnh từ điện thoại: <input type="file" accept="image/*" capture="environment">
   * ===================================================================== */
  TXTV.compressImage = function (file, o) {
    o = Object.assign({ maxWidth: 1600, maxHeight: 1600, quality: 0.8, type: 'image/jpeg' }, o || {});
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, o.maxWidth / img.width, o.maxHeight / img.height), w = Math.round(img.width * s), h = Math.round(img.height * s);
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d'); if (o.type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
        ctx.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
        var dataUrl = cv.toDataURL(o.type, o.quality), data = dataUrl.split(',')[1];
        resolve({ name: file.name.replace(/\.\w+$/, '') + (o.type === 'image/png' ? '.png' : '.jpg'), mimeType: o.type, size: Math.round(data.length * 3 / 4), width: w, height: h, data: data, dataUrl: dataUrl });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('File không phải ảnh hợp lệ')); };
      img.src = url;
    });
  };

  /** Khởi tạo thành phần v1.2 (gọi trong TXTV.init) */
  function initV12(root) {
    $$('input[data-tv-datepicker]', root).forEach(initDatepicker);
    $$('[data-tv-editor]', root).forEach(initEditor);
    $$('[data-tv-wizard]', root).forEach(function (w) { TXTV.wizard(w); });
    $$('[data-tv-gauge]', root).forEach(function (g) { TXTV.gauge(g, g.dataset.value, { label: g.dataset.label, max: g.dataset.max ? +g.dataset.max : undefined, size: g.dataset.size ? +g.dataset.size : undefined, unit: g.dataset.unit }); });
  }

  /* =====================================================================
   * HIỆN CODE MẪU (dùng trong trang tài liệu) – <div data-tv-demo> ... </div>
   * ===================================================================== */
  TXTV.dedent = function (s) {
    var lines = s.replace(/^\n+|\s+$/g, '').split('\n');
    var min = Math.min.apply(null, lines.filter(function (l) { return l.trim(); }).map(function (l) { return l.match(/^\s*/)[0].length; }));
    return lines.map(function (l) { return l.slice(min); }).join('\n');
  };

  /* =====================================================================
   * KHỞI TẠO – event delegation + init các thành phần cần JS
   * ===================================================================== */
  TXTV.init = function (root) {
    root = root || document;
    $$('[data-tv-dropzone]', root).forEach(initDropzone);
    $$('[data-tv-tags]', root).forEach(initTags);
    $$('select[data-tv-combo]', root).forEach(function (sel) { sel.multiple ? initComboMulti(sel) : initCombo(sel); });
    $$('[data-tv-progress-ring]', root).forEach(function (el) { TXTV.progressRing(el, el.dataset.value); });
    $$('[data-tv-format]', root).forEach(function (el) {
      var f = TXTV.format[el.dataset.tvFormat]; if (f) el.textContent = f(el.dataset.value !== undefined ? el.dataset.value : el.textContent.trim());
    });
    $$('[data-tv-tabs]', root).forEach(function (t) {
      var active = t.querySelector('[data-tab].active') || t.querySelector('[data-tab]');
      if (active) TXTV.tabs.show(t, active.getAttribute('data-tab'));
    });
    initExtras(root);
    initV12(root);
  };

  document.addEventListener('click', function (e) {
    var t = e.target;
    // Click ra ngoài (hoặc chọn 1 mục) -> đóng dropdown
    if (!t.closest('[data-tv-toggle="dropdown"]') && (!t.closest('.dropdown-menu') || t.closest('.dropdown-item'))) TXTV.dropdown.closeAll();
    var toggle = t.closest('[data-tv-toggle]');
    if (toggle) {
      var kind = toggle.getAttribute('data-tv-toggle'), target = toggle.getAttribute('data-tv-target') || toggle.getAttribute('href');
      if (kind === 'modal')    { e.preventDefault(); TXTV.modal.open(target); return; }
      if (kind === 'drawer')   { e.preventDefault(); TXTV.drawer.open(target); return; }
      if (kind === 'dropdown') { e.preventDefault(); e.stopPropagation(); TXTV.dropdown.toggle(toggle); return; }
      if (kind === 'sidebar')  { e.preventDefault(); TXTV.sidebar.toggle(); return; }
      if (kind === 'theme')    { e.preventDefault(); TXTV.theme.toggle(); return; }
      if (kind === 'password') {
        var inp = $(target) || toggle.parentElement.querySelector('input');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        var ic = toggle.querySelector('i'); if (ic) ic.className = 'fa-solid ' + (inp.type === 'password' ? 'fa-eye' : 'fa-eye-slash');
        return;
      }
      if (kind === 'collapse') { var c = $(target); if (c) c.classList.toggle('hidden'); toggle.classList.toggle('open'); return; }
    }
    var dismiss = t.closest('[data-tv-dismiss]');
    if (dismiss) {
      var k = dismiss.getAttribute('data-tv-dismiss');
      if (k === 'modal')  { TXTV.modal.close(dismiss.closest('.modal')); return; }
      if (k === 'drawer') { TXTV.drawer.close(dismiss.closest('.drawer')); return; }
      if (k === 'alert' || k === 'banner')  { var al = dismiss.closest('.alert, .banner'); al.style.transition = 'opacity .2s'; al.style.opacity = 0; setTimeout(function () { al.remove(); }, 200); return; }
    }
    // Click nền modal / drawer
    if (t.classList.contains('modal-backdrop') || t.classList.contains('drawer-backdrop') || t.classList.contains('modal')) {
      var ov = t.closest('.modal, .drawer');
      if (ov && ov.getAttribute('data-static') !== 'true') (ov.classList.contains('drawer') ? TXTV.drawer : TXTV.modal).close(ov);
      else if (ov) { var d = ov.querySelector('.modal-dialog'); if (d) { d.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.02)' }, { transform: 'scale(1)' }], { duration: 200 }); } }
      return;
    }
    if (t.classList.contains('app-backdrop')) { TXTV.sidebar.close(); return; }
    var tab = t.closest('[data-tab]');
    if (tab && tab.closest('[data-tv-tabs]')) { e.preventDefault(); TXTV.tabs.show(tab.closest('[data-tv-tabs]'), tab.getAttribute('data-tab')); return; }
    var acc = t.closest('.accordion-trigger'); if (acc) { toggleAccordion(acc); return; }
    var step = t.closest('[data-tv-number] [data-step]'); if (step) { stepNumber(step); return; }
    var copy = t.closest('[data-tv-copy]'); if (copy) { var src = $(copy.getAttribute('data-tv-copy')); TXTV.copy(src ? (src.value || src.textContent) : copy.getAttribute('data-tv-copy')); return; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var top = openStack[openStack.length - 1];
      if (top && top.getAttribute('data-static') !== 'true') (top.classList.contains('drawer') ? TXTV.drawer : TXTV.modal).close(top);
      TXTV.dropdown.closeAll();
    }
  });

  // Xóa trạng thái lỗi khi người dùng sửa
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.classList && el.classList.contains('is-invalid')) {
      el.classList.remove('is-invalid');
      var g = el.closest('.form-group') || el.parentElement; var err = g && g.querySelector('.form-error[data-auto]'); if (err) err.remove();
    }
  });

  function ready(fn) { document.readyState !== 'loading' ? fn() : document.addEventListener('DOMContentLoaded', fn); }
  ready(function () {
    TXTV.theme.init();
    var app = $('.app');
    if (app && store('txtv-sidebar') === '1' && global.innerWidth >= 1024) app.classList.add('sidebar-collapsed');
    TXTV.init(document);
  });

  global.TXTV = TXTV;
  if (!global.TV) global.TV = TXTV;
})(window);
</script>
